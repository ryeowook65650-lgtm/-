<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>廈門旅遊 2026</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#d8d8d0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* =========================================
           1. 高級原生 App 變數設定 (Aman Resort / Wabi-Sabi Style)
           ========================================= */
        :root {
            --bg-color: #d8d8d0;         
            --card-bg: #FCFAFA;          
            --primary: #713e18;          
            --primary-light: rgba(113, 62, 24, 0.08); 
            --secondary: #b78f64;        
            --accent: #f4c07d;           
            --text-main: #382615;        
            --text-muted: #857262;       
            --border-color: rgba(56, 38, 21, 0.1);
            
            --color-success: #6b8c65;
            --color-danger: #A04000;
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            
            --shadow-card: 0 8px 24px rgba(56, 38, 21, 0.06), 0 2px 8px rgba(56, 38, 21, 0.03);
            --shadow-btn: 0 6px 16px rgba(113, 62, 24, 0.2);
            --border-inner: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            
            --font-sans: 'Inter', 'Noto Sans TC', sans-serif;
            --font-serif: 'Noto Serif TC', serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: var(--font-sans); }

        body { 
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overscroll-behavior-y: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
        }

        button, input, select { appearance: none; -webkit-appearance: none; border: none; background: none; outline: none; margin: 0; padding: 0; }
        button { cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.2s; }
        button:active { transform: scale(0.94); opacity: 0.8; }

        /* =========================================
           2. 頂部狀態列
           ========================================= */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(216, 216, 208, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: calc(16px + env(safe-area-inset-top)) 24px 16px;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .app-header h1 { margin: 0; font-family: var(--font-serif); font-size: 28px; font-weight: 900; color: var(--text-main); letter-spacing: 0.5px; }
        .app-header .subtitle { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-top: 4px; display: block; letter-spacing: 1px; text-transform: uppercase;}
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .weather-pill { background: var(--card-bg); padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; box-shadow: var(--border-inner), var(--shadow-card); display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color);}
        .refresh-fab { background: var(--card-bg); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--border-inner), var(--shadow-card); color: var(--text-main); font-size: 18px; border: 1px solid var(--border-color);}

        /* =========================================
           3. 底部導覽列
           ========================================= */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(252, 250, 250, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(56, 38, 21, 0.05); z-index: 999;
            display: flex; justify-content: space-around; padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
        }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); }
        .tab-btn i { font-size: 24px; transition: 0.2s; }
        .tab-btn span { font-size: 11px; font-weight: 700; }
        .tab-btn.active { color: var(--primary); }

        /* =========================================
           4. 視圖容器
           ========================================= */
        .view-container { display: none; padding: 0 20px; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .view-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); filter: blur(4px);} to { opacity: 1; transform: translateY(0); filter: blur(0);} }

        /* =========================================
           5. 記帳與餘額
           ========================================= */
        .balance-card {
            background: linear-gradient(135deg, #382615 0%, #20140A 100%);
            border-radius: var(--radius-lg); padding: 24px; color: #FFF; margin-top: 10px; margin-bottom: 24px;
            box-shadow: 0 16px 32px rgba(56, 38, 21, 0.2); position: relative; overflow: hidden;
        }
        .b-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 1px;}
        .b-amount { font-family: var(--font-serif); font-size: 42px; font-weight: 900; margin: 4px 0; background: linear-gradient(135deg, #FFF 0%, #E2DDD5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .b-sub { font-size: 15px; color: var(--secondary); font-weight: 600; }
        .rate-badge { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 8px; font-size: 11px; color: var(--accent); border: 1px solid rgba(244, 192, 125, 0.2);}
        .stats-btn { background: rgba(255,255,255,0.1); border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--accent); border: 1px solid rgba(244, 192, 125, 0.2); }

        .budget-wrapper { margin-top: 24px; }
        .budget-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
        .budget-track { height: 6px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
        .budget-fill { height: 100%; width: 0%; background: var(--color-success); border-radius: 99px; transition: width 1s ease; }

        .segment-wrapper { background: rgba(56, 38, 21, 0.06); border-radius: 12px; display: flex; padding: 4px; margin-bottom: 20px; }
        .seg-btn { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); border-radius: 8px; transition: 0.3s; }
        .seg-btn.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(56, 38, 21, 0.08); }

        /* 便當盒網格 */
        .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
        .bento-box { background: var(--card-bg); border-radius: var(--radius-md); padding: 16px; text-align: center; border: 1px solid var(--border-color); box-shadow: var(--shadow-card); }
        .bento-box.active { border: 2px solid var(--primary); color: var(--primary); }
        .bento-icon { font-size: 32px; display: block; margin-bottom: 8px; }

        /* 輸入框組件 */
        .input-composite { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-card); margin-bottom: 30px; border: 1px solid var(--border-color); }
        .input-row { display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 12px; }
        .input-row input { flex: 1; font-size: 16px; font-weight: 600; color: var(--text-main); }
        .price-action-row { display: flex; align-items: center; justify-content: space-between; }
        .price-input-wrapper { display: flex; align-items: center; background: var(--bg-color); border-radius: 12px; padding: 12px 16px; flex: 1; margin-right: 12px; }
        .curr-toggle { font-weight: 800; font-size: 20px; color: var(--primary); margin-right: 12px; padding-right: 12px; border-right: 2px solid rgba(56, 38, 21, 0.15); cursor: pointer; }
        .price-input-wrapper input { font-size: 24px; font-weight: 800; width: 100%; }
        .submit-fab { width: 54px; height: 54px; border-radius: 16px; background: var(--primary); color: #FFF; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-btn); }

        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .h-item { background: var(--card-bg); padding: 16px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
        .h-price { font-family: var(--font-serif); font-size: 18px; font-weight: 900; color: var(--primary); }

        /* =========================================
           6. 行程版面 (Editorial Layout)
           ========================================= */
        .trip-card { background: var(--card-bg); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-color);}
        .t-img { width: 100%; height: 200px; object-fit: cover; filter: sepia(0.1) contrast(0.95);}
        .t-body { padding: 24px; }
        .t-time { font-size: 11px; font-weight: 800; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
        .t-title { font-family: var(--font-serif); font-size: 22px; font-weight: 900; margin: 0 0 16px; line-height: 1.4; }
        .t-row { display: flex; gap: 12px; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: var(--text-muted); align-items: flex-start; }
        .t-row i { font-size: 20px; color: var(--secondary); }
        
        /* 複製地址按鈕樣式 */
        .copy-addr-btn { background: var(--bg-color); border: 1px solid var(--border-color); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; margin-left: 8px; color: var(--text-main); }
        
        .map-btn { display: block; width: 100%; text-align: center; background: var(--text-main); color: #FFF; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; text-decoration: none; margin-top: 20px; }

        /* Modal / Toast */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(56, 38, 21, 0.4); backdrop-filter: blur(8px); z-index: 2000; opacity: 0; pointer-events: none; transition: 0.3s; display: flex; align-items: flex-end; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card { background: var(--bg-color); width: 100%; border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; pointer-events: none;}
        .toast { background: rgba(56, 38, 21, 0.9); color: #FFF; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(56,38,21,0.3); display: flex; align-items: center; gap: 12px; animation: toastIn 0.3s forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="app-header">
        <div>
            <h1>Xiamen 2026</h1>
            <span class="subtitle">4月24日 - 4月27日</span>
        </div>
        <div class="header-actions">
            <button class="refresh-fab" onclick="manualSync()"><i class="ph-bold ph-arrows-clockwise"></i></button>
            <div class="weather-pill" id="weather-badge" onclick="fetchXiamenWeather()">🇨🇳 載入中</div>
        </div>
    </header>

    <main>
        <section id="view-accounting" class="view-container active">
            <div class="balance-card">
                <div class="b-title">
                    <span>Total Expenses</span>
                    <div class="b-title-right">
                        <span class="rate-badge" id="rate-display">匯率 4.45</span>
                        <button class="stats-btn" onclick="openStatsModal()"><i class="ph-bold ph-chart-pie-slice"></i></button>
                    </div>
                </div>
                <h2 class="b-amount" id="total-primary">NT$ 0</h2>
                <div class="b-sub" id="total-secondary">≈ ¥ 0</div>
                <div class="budget-wrapper">
                    <div class="budget-info">
                        <span id="budget-rem-label">剩餘 NT$ 30,000</span>
                        <span class="budget-tot">/ 30k 預算</span>
                    </div>
                    <div class="budget-track"><div class="budget-fill" id="budget-fill"></div></div>
                </div>
            </div>

            <div class="segment-wrapper" id="date-segment">
                <button class="seg-btn active" onclick="selectDate('4/24', this)">4/24</button>
                <button class="seg-btn" onclick="selectDate('4/25', this)">4/25</button>
                <button class="seg-btn" onclick="selectDate('4/26', this)">4/26</button>
                <button class="seg-btn" onclick="selectDate('4/27', this)">4/27</button>
            </div>

            <div class="segment-wrapper" id="person-segment">
                <button class="seg-btn active" onclick="selectPerson('', this)">👥 共用</button>
                <button class="seg-btn" onclick="selectPerson('小爸', this)">🦭 小爸</button>
                <button class="seg-btn" onclick="selectPerson('阿馨', this)"> Ham</button>
                <button class="seg-btn" onclick="selectPerson('阿雪', this)">🐵 阿雪</button>
            </div>

            <h3 class="section-title">選擇分類</h3>
            <div class="bento-grid" id="category-container">
                <button class="bento-box active" onclick="selectCategory('交通', this)"><i class="ph-fill ph-taxi bento-icon"></i>交通</button>
                <button class="bento-box" onclick="selectCategory('食物', this)"><i class="ph-fill ph-hamburger bento-icon"></i>食物</button>
                <button class="bento-box" onclick="selectCategory('購物', this)"><i class="ph-fill ph-tote bento-icon"></i>購物</button>
                <button class="bento-box" onclick="selectCategory('其他', this)"><i class="ph-fill ph-sparkle bento-icon"></i>其他</button>
            </div>

            <div class="input-composite">
                <div class="input-row"><input type="text" id="item-name" placeholder="品項名稱 (選填)"></div>
                <div class="price-action-row">
                    <div class="price-input-wrapper">
                        <div class="curr-toggle" id="curr-toggle" onclick="toggleCurrency()">¥</div>
                        <input type="number" id="item-price" placeholder="輸入人民幣" min="0" step="0.01">
                    </div>
                    <button class="submit-fab" onclick="addExpense()"><i class="ph-bold ph-plus"></i></button>
                </div>
            </div>

            <h3 class="section-title">今日紀錄</h3>
            <div id="expense-list" class="history-list"></div>
        </section>

        <section id="view-itinerary" class="view-container">
            <div class="segment-wrapper" style="margin-top: 10px;">
                <button class="seg-btn active" onclick="switchDay('day1', this)">D1</button>
                <button class="seg-btn" onclick="switchDay('day2', this)">D2</button>
                <button class="seg-btn" onclick="switchDay('day3', this)">D3</button>
                <button class="seg-btn" onclick="switchDay('day4', this)">D4</button>
            </div>
            <div id="itinerary-content"></div>
        </section>

        <section id="view-flight" class="view-container" style="padding-top: 10px;"></section>
    </main>

    <nav class="bottom-nav">
        <button class="tab-btn active" id="tab-accounting" onclick="switchTab('accounting')"><i class="ph-fill ph-wallet"></i><span>記帳</span></button>
        <button class="tab-btn" id="tab-itinerary" onclick="switchTab('itinerary')"><i class="ph-fill ph-map-trifold"></i><span>行程</span></button>
        <button class="tab-btn" id="tab-flight" onclick="switchTab('flight')"><i class="ph-fill ph-airplane-tilt"></i><span>航班</span></button>
    </nav>

    <div class="modal-overlay" id="stats-modal" onclick="closeStatsModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div id="stats-content"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

                { time: "車程預估 18 分鐘", title: "逛街: 廈門尚柏奧特萊斯", address: "廈門市集美區天水路2號", icon: "ph-taxi", info: "搭乘 計程車<br>交通花費：¥30", mapUrl: "https://j.map.baidu.com/8f/u8h", imgUrl: "https://symphonyholdings.com/assets/img/meta.jpg" },
                { time: "車程預估 40 分鐘", title: "回飯店: 廈門瑞頤大酒店", address: "廈門市思明區鷺江道12號", icon: "ph-taxi", info: "搭乘 計程車<br>交通花費：¥80", mapUrl: "https://j.map.baidu.com/36/PoJ", imgUrl: "https://content.skyscnr.com/available/2306062384/2306062384_WxH.jpg" },
                { time: "路程預估 15 分鐘", title: "晚餐逛逛: 中山路步行街", address: "廈門市思明區中山路", icon: "ph-person-simple-walk", info: "步行<br>交通花費：¥0", mapUrl: "https://j.map.baidu.com/1c/AsK", imgUrl: "https://images.unsplash.com/photo-1590559899731-a38283b156b6?q=80&w=800&auto=format&fit=crop" },
                { time: "路程預估 15 分鐘", title: "回飯店: 廈門瑞頤大酒店", address: "廈門市思明區鷺江道12號", icon: "ph-person-simple-walk", info: "步行<br>交通花費：¥0", mapUrl: "https://j.map.baidu.com/36/PoJ", imgUrl: "https://content.skyscnr.com/available/2306062384/2306062384_WxH.jpg" }
            ],
            day4: [
                { time: "車程預估 25 分鐘", title: "出發機場: 廈門高崎國際機場", address: "廈門市湖里區翔雲一路121號", icon: "ph-taxi", info: "搭乘 計程車<br>交通花費：¥45<br>準備搭乘 11:40 班機回台", mapUrl: "https://j.map.baidu.com/47/bYd", imgUrl: "https://file.variflight.com/buckets/carnoc/keys/7d08cc3dcf7d03f6bbde6f98a9177a0d.jpeg" }
            ]
        };

        const FLIGHT_DATA = [
            { label: "去程 Outbound", date: "4/24 (五)", fCode: "TPE", tCode: "XMN", dTime: "08:40", aTime: "10:30", air: "MANDARIN AE991", url: "https://www.mandarin-airlines.com/b2c/webcheckin" },
            { label: "回程 Inbound", date: "4/27 (一)", fCode: "XMN", tCode: "TPE", dTime: "11:40", aTime: "13:30", air: "MANDARIN AE992", url: "https://www.mandarin-airlines.com/b2c/webcheckin" }
        ];

        const Store = {
            state: {
                rate: parseFloat(localStorage.getItem('cached_rate_xmn')) || 4.45, 
                expenses: JSON.parse(localStorage.getItem('cached_expenses_xmn') || '[]'),
                date: '4/24',
                person: '',     
                category: '交通',
                currency: 'RMB'
            },
            updateRate(newRate) { this.state.rate = newRate; localStorage.setItem('cached_rate_xmn', newRate); },
            updateExpenses(newData) { this.state.expenses = newData; localStorage.setItem('cached_expenses_xmn', JSON.stringify(newData)); }
        };

        const EMOJI_MAP = { '交通': 'ph-taxi', '食物': 'ph-hamburger', '購物': 'ph-tote', '其他': 'ph-sparkle' };
        const TOTAL_BUDGET = 30000;

        document.addEventListener('DOMContentLoaded', () => {
            renderFlights();
            renderItinerary('day1');
            fetchExchangeRate();
            fetchXiamenWeather();
            renderExpenses();
            if (navigator.onLine) fetchExpenses();
        });

        // UI 邏輯
        function switchTab(tabId) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function switchDay(day, el) {
            document.querySelectorAll('#view-itinerary .seg-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            renderItinerary(day);
        }

        function selectDate(date, el) {
            Store.state.date = date;
            document.querySelectorAll('#date-segment .seg-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            renderExpenses();
        }

        function selectPerson(person, el) {
            Store.state.person = person;
            document.querySelectorAll('#person-segment .seg-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }

        function selectCategory(cat, el) {
            Store.state.category = cat;
            document.querySelectorAll('.bento-box').forEach(box => box.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleCurrency() {
            const toggleBtn = document.getElementById('curr-toggle');
            if (Store.state.currency === 'RMB') {
                Store.state.currency = 'TWD';
                toggleBtn.innerText = '$';
                document.getElementById('item-price').placeholder = "輸入台幣";
            } else {
                Store.state.currency = 'RMB';
                toggleBtn.innerText = '¥';
                document.getElementById('item-price').placeholder = "輸入人民幣";
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast('地址已複製'));
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="ph-bold ph-check"></i> <span>${msg}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function renderItinerary(day) {
            const container = document.getElementById('itinerary-content');
            let html = '';
            (ITINERARY_DATA[day] || []).forEach(item => {
                html += `
                <div class="trip-card">
                    <img src="${item.imgUrl}" class="t-img" loading="lazy">
                    <div class="t-body">
                        <span class="t-time">${item.time}</span>
                        <h3 class="t-title">${item.title}</h3>
                        <div class="t-row"><i class="ph-bold ph-map-pin"></i> ${item.address} <button class="copy-addr-btn" onclick="copyToClipboard('${item.address}')">複製</button></div>
                        <div class="t-row"><i class="ph-bold ${item.icon}"></i> ${item.info}</div>
                        <a href="${item.mapUrl}" class="map-btn" target="_blank">百度地圖導航 ↗</a>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderFlights() {
            const container = document.getElementById('view-flight');
            let html = '';
            FLIGHT_DATA.forEach(f => {
                html += `
                <div class="flight-card">
                    <div class="f-top">
                        <div><span class="f-code">${f.fCode}</span><span class="f-city">TPE</span></div>
                        <i class="ph-fill ph-airplane-tilt f-icon"></i>
                        <div style="text-align:right;"><span class="f-code">${f.tCode}</span><span class="f-city">XMN</span></div>
                    </div>
                    <div class="f-grid">
                        <div><span class="f-label">日期</span><span class="f-val">${f.date}</span></div>
                        <div><span class="f-label">班機</span><span class="f-val">${f.air}</span></div>
                        <div><span class="f-label">起飛</span><span class="f-val">${f.dTime}</span></div>
                        <div><span class="f-label">抵達</span><span class="f-val">${f.aTime}</span></div>
                    </div>
                    <a href="${f.url}" class="map-btn" target="_blank">線上報到</a>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderExpenses() {
            let totalTWD = 0;
            const listEl = document.getElementById('expense-list');
            listEl.innerHTML = '';
            const todayItems = Store.state.expenses.filter(item => {
                const sheetDate = String(item.date).trim();
                const targetDate = Store.state.date;
                if (sheetDate.includes(targetDate)) return true;
                if (sheetDate.includes('T')) {
                    const d = new Date(sheetDate);
                    return `${d.getMonth() + 1}/${d.getDate()}` === targetDate;
                }
                return false;
            });

            todayItems.forEach(item => {
                const price = Math.round(parseFloat(item.price));
                const icon = EMOJI_MAP[item.cat] || 'ph-sparkle';
                listEl.innerHTML += `
                <div class="h-item">
                    <div class="h-left"><h4>${item.name}</h4><span class="h-jpy">${item.cat}</span></div>
                    <div class="h-right"><div class="h-price">$${price}</div><button onclick="deleteExpense('${item.id}')" style="color:var(--text-muted)"><i class="ph-bold ph-trash"></i></button></div>
                </div>`;
            });

            Store.state.expenses.forEach(item => { totalTWD += Math.round(parseFloat(item.price) || 0); });
            const totalRMB = (totalTWD / Store.state.rate).toFixed(1);
            document.getElementById('total-primary').innerText = `NT$ ${totalTWD.toLocaleString()}`;
            document.getElementById('total-secondary').innerText = `≈ ¥ ${totalRMB}`;

            let spentPercent = (totalTWD / TOTAL_BUDGET) * 100;
            let remaining = TOTAL_BUDGET - totalTWD;
            document.getElementById('budget-fill').style.width = `${Math.min(spentPercent, 100)}%`;
            document.getElementById('budget-rem-label').innerText = remaining >= 0 ? `剩餘 NT$ ${remaining.toLocaleString()}` : `超支 NT$ ${Math.abs(remaining).toLocaleString()}`;
        }

        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/CNY');
                const data = await res.json();
                if (data?.rates?.TWD) Store.updateRate(data.rates.TWD);
                document.getElementById('rate-display').innerText = `匯率 ${Store.state.rate.toFixed(2)}`;
            } catch (e) {}
        }

        async function fetchXiamenWeather() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=24.4798&longitude=118.0894&current_weather=true&timezone=Asia%2FShanghai`);
                const data = await res.json();
                document.getElementById('weather-badge').innerHTML = `🇨🇳 廈門 ${Math.round(data.current_weather.temperature)}°C`;
            } catch (e) {}
        }

        async function fetchExpenses() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=read&t=${Date.now()}`);
                const data = await res.json();
                if (Array.isArray(data)) { Store.updateExpenses(data); renderExpenses(); }
            } catch (err) {}
        }

        async function addExpense() {
            const priceEl = document.getElementById('item-price');
            const inputPrice = parseFloat(priceEl.value);
            if (isNaN(inputPrice) || inputPrice <= 0) return;

            let finalName = (document.getElementById('item-name').value || Store.state.category);
            if (Store.state.person) finalName = `【${Store.state.person}】${finalName}`;
            const finalPriceTWD = Store.state.currency === 'RMB' ? Math.round(inputPrice * Store.state.rate) : Math.round(inputPrice);

            const newId = Date.now().toString();
            const newObj = { id: newId, date: Store.state.date, cat: Store.state.category, name: finalName, price: finalPriceTWD };
            Store.updateExpenses([...Store.state.expenses, newObj]);
            renderExpenses();
            priceEl.value = '';
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'add', ...newObj }) });
                fetchExpenses();
            } catch (err) {}
        }

        async function deleteExpense(id) {
            if (!confirm('確定刪除？')) return;
            Store.updateExpenses(Store.state.expenses.filter(i => i.id !== id));
            renderExpenses();
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'delete', id }) });
                fetchExpenses();
            } catch (err) {}
        }

        function manualSync() { showToast('正在同步...'); fetchExpenses(); fetchExchangeRate(); }
    </script>
</body>
</html>
