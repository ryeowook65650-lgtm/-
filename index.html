<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>廈門旅遊</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#d8d8d0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* --- 大地清爽配色 --- */
            --color-1: #382615; 
            --color-2: #713e18; 
            --color-3: #d8d8d0; 
            --color-4: #f4c07d; 
            --color-5: #b78f64; 
            --color-white: #FCFAFA; 
            
            --color-success: #6b8c65; 
            --color-warning: #d4a373; 
            --color-danger: #A04000;  

            --font-serif: "Noto Serif TC", "Georgia", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            
            --border-width: 1px; 
            --box-shadow-soft: 0 8px 25px rgba(56, 38, 21, 0.05);
            --transition-speed: 0.25s;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border-radius: 0 !important; }
        
        body { 
            margin: 0; padding: 0; 
            font-family: var(--font-sans);
            background-color: var(--color-3); 
            color: var(--color-1);
            padding-bottom: 80px;
            letter-spacing: 0.02em; 
        }

        /* --- 頂部與導覽 --- */
        .top-bar { position: sticky; top: 0; z-index: 999; background-color: rgba(216, 216, 208, 0.95); backdrop-filter: blur(8px); border-bottom: var(--border-width) solid var(--color-1); padding-top: env(safe-area-inset-top); }
        .header-info { padding: 25px 20px 15px; display: flex; justify-content: space-between; align-items: center; }
        .app-title { font-family: var(--font-serif); font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--color-1); display: flex; align-items: center; line-height: 1; }
        .refresh-btn { font-size: 18px; cursor: pointer; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); margin-left: 8px; opacity: 0.7;}
        .refresh-btn:active { transform: rotate(180deg) scale(0.9); opacity: 1; }
        
        .weather-badge { font-size: 13px; font-weight: 600; color: var(--color-1); background: var(--color-4); padding: 8px 14px; border: var(--border-width) solid var(--color-1); cursor: pointer; transition: var(--transition-speed); display: flex; align-items: center; gap: 6px; box-shadow: 2px 2px 0 rgba(56, 38, 21, 1); }
        .weather-badge:active { transform: translate(2px, 2px); box-shadow: 0 0 0 rgba(56, 38, 21, 1); }

        .nav-bar-row { display: flex; align-items: center; padding: 5px 20px 25px; gap: 12px; }
        .nav-btn, .nav-select { display: block; width: 100%; text-align: center; padding: 14px 0; font-size: 14px; font-weight: 600; color: var(--color-1); cursor: pointer; position: relative; transition: var(--transition-speed); background: var(--color-3); border: var(--border-width) solid var(--color-1); appearance: none; -webkit-appearance: none; outline: none; font-family: var(--font-sans); }
        .nav-btn { flex: 1; white-space: nowrap; box-shadow: 2px 2px 0 rgba(56, 38, 21, 0.1); }
        .nav-btn:active { transform: translate(1px, 1px); box-shadow: none; }
        
        .nav-select-wrapper { flex: 1.45; position: relative; }
        .nav-select-wrapper::after { content: '▼'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--color-1); pointer-events: none; transition: var(--transition-speed); z-index: 2; }
        .nav-select { padding: 14px 12px; text-align: left; box-shadow: 2px 2px 0 rgba(56, 38, 21, 0.1); }
        
        .nav-btn.active, .nav-select-wrapper.active .nav-select { background-color: var(--color-1); color: var(--color-3); box-shadow: none; }
        .nav-select-wrapper.active::after { color: var(--color-3); }

        .view-container { display: none; padding: 25px 20px; max-width: 600px; margin: 0 auto; }
        .view-container.active { display: block; animation: fadeUpIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUpIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .retro-card, .flight-ticket, .balance-card, .input-area, .trip-card { background-color: var(--color-white); border: var(--border-width) solid var(--color-1); box-shadow: var(--box-shadow-soft); margin-bottom: 25px; transition: transform 0.3s ease; }
        
        /* --- 記帳版面 (Accounting) --- */
        .balance-card { overflow: hidden; padding: 30px; position: relative; }
        .balance-label { font-size: 13px; font-weight: 700; color: var(--color-5); letter-spacing: 2px; text-transform: uppercase;}
        .balance-amount { font-family: var(--font-serif); font-size: 44px; margin: 8px 0; font-weight: 700; color: var(--color-1); letter-spacing: 1px; line-height: 1.1; }
        .balance-sub { font-size: 15px; font-weight: 600; color: var(--color-2); opacity: 0.7; }
        .rate-tag { position: absolute; top: 30px; right: 30px; font-size: 12px; background-color: var(--color-3); color: var(--color-1); padding: 6px 10px; font-weight: 700; border: var(--border-width) solid var(--color-1); }
        
        .budget-container { margin-top: 30px; padding: 20px; background: rgba(183, 143, 100, 0.05); border: var(--border-width) dashed var(--color-5); position: relative; display: flex; flex-direction: column; gap: 12px; }
        .budget-rem-row { text-align: left; font-size: 20px; font-weight: 700; color: var(--color-1); font-family: var(--font-serif); transition: color 0.3s; }
        .budget-track { height: 8px; width: 100%; border: var(--border-width) solid var(--color-1); background: #FFFFFF; overflow: hidden; }
        .budget-fill { height: 100%; width: 0%; background-color: var(--color-success); transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.5s ease; }
        .budget-tot-row { text-align: right; font-size: 12px; font-weight: 600; color: var(--color-2); opacity: 0.6; }

        /* 互動式過濾卡片 UX */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 30px; }
        .stat-box { border-top: 2px solid var(--color-3); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: 0.3s; opacity: 0.7; }
        .stat-box:active { transform: scale(0.95); }
        .stat-box.active-filter { border-top: 2px solid var(--color-1); opacity: 1; background: rgba(183, 143, 100, 0.05); padding: 12px 8px 8px; margin-top: -12px; border-radius: 0; }
        .stat-box-title { font-size: 12px; font-weight: 700; color: var(--color-5); display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box.active-filter .stat-box-title { color: var(--color-1); }
        .stat-box-val { font-size: 18px; font-weight: 700; color: var(--color-1); font-family: var(--font-serif); }

        /* --- 輸入區塊 --- */
        .input-area { padding: 25px; background: var(--color-white); }
        .input-title { font-size: 14px; font-weight: 700; color: var(--color-5); margin-bottom: 12px; display:block; letter-spacing: 1px;}
        
        .scroll-container { overflow-x: auto; white-space: nowrap; padding-bottom: 15px; margin-bottom: 5px; scrollbar-width: none; display: flex; gap: 10px; }
        .scroll-container::-webkit-scrollbar { display: none; }
        
        .chip { display: inline-block; background: transparent; border: var(--border-width) solid var(--color-5); padding: 8px 18px; font-size: 14px; font-weight: 600; color: var(--color-2); cursor: pointer; transition: var(--transition-speed); flex-shrink: 0; }
        .chip.active { background: var(--color-1); border-color: var(--color-1); color: var(--color-3); }

        /* 分類按鈕 */
        .cat-row { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
        .cat-btn { flex: 1; min-width: 70px; padding: 12px 5px; background: transparent; border: var(--border-width) solid var(--color-5); font-size: 13px; font-weight: 600; color: var(--color-2); cursor: pointer; transition: var(--transition-speed); }
        .cat-btn.active { background: var(--color-1); border-color: var(--color-1); color: var(--color-3); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(56,38,21,0.15); }
        .cat-emoji { font-size: 22px; display: block; margin-bottom: 8px; transition: transform 0.2s; }
        .cat-btn.active .cat-emoji { transform: scale(1.15); }

        /* 輸入群組 */
        .input-group { border: var(--border-width) solid var(--color-1); background: #FFFFFF; margin-bottom: 20px; transition: box-shadow 0.3s ease; }
        .input-group:focus-within { box-shadow: 4px 4px 0 rgba(56, 38, 21, 0.1); }
        
        .curr-btn-row { display: flex; border-bottom: var(--border-width) solid var(--color-1); background: var(--color-3); }
        .curr-btn { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 600; color: var(--color-2); cursor: pointer; transition: var(--transition-speed); border-right: var(--border-width) solid var(--color-1); opacity: 0.6; }
        .curr-btn:last-child { border-right: none; }
        .curr-btn.active { background: var(--color-1); color: var(--color-3); opacity: 1; }

        .modern-input { width: 100%; padding: 16px; border: none; background: transparent; outline: none; font-size: 16px; color: var(--color-1); transition: background 0.3s; font-weight: 600; }
        .modern-input:focus { background: rgba(183, 143, 100, 0.05); }
        .modern-input::placeholder { color: rgba(113, 62, 24, 0.3); font-weight: 500;}

        .add-btn { width: 100%; background: var(--color-4); color: var(--color-1); padding: 18px; border: var(--border-width) solid var(--color-1); font-size: 16px; font-weight: 700; cursor: pointer; transition: var(--transition-speed); letter-spacing: 2px; box-shadow: 3px 3px 0 rgba(56, 38, 21, 1); display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px;}
        .add-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 rgba(56, 38, 21, 1); }
        .add-btn:disabled { background: var(--color-3); border-color: var(--color-1); color: var(--color-5); box-shadow: none; cursor: not-allowed; transform: none; }

        /* --- 歷史紀錄 (Collapsible) --- */
        .date-section { margin-bottom: 25px; }
        .date-divider { font-family: var(--font-serif); font-size: 20px; color: var(--color-1); font-weight: 700; padding: 10px 5px; border-bottom: 2px solid var(--color-1); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; opacity: 0.9; }
        .date-divider:active { background: rgba(183, 143, 100, 0.1); }
        .date-divider::after { content: '▾'; font-family: var(--font-sans); font-size: 16px; transition: 0.3s; }
        .date-section.collapsed .date-divider::after { transform: rotate(-90deg); }
        .date-section.collapsed .history-items-wrapper { display: none; }
        
        .history-item { display: flex; justify-content: space-between; align-items: center; background: var(--color-white); padding: 20px; margin-bottom: 12px; border: var(--border-width) solid var(--color-1); transition: transform 0.2s, box-shadow 0.2s; }
        .history-item:active { transform: scale(0.98); background-color: #f9f9f9; }
        
        .h-name { font-weight: 700; font-size: 16px; color: var(--color-1); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;}
        .h-tag { font-size: 11px; background: var(--color-3); border: var(--border-width) solid var(--color-5); padding: 2px 6px; color: var(--color-2); font-weight: 700; font-family: var(--font-sans); }
        .h-cat { font-size: 12px; color: var(--color-5); font-weight: 600; margin-top: 6px; letter-spacing: 1px;}
        .h-price { font-weight: 700; font-size: 18px; color: var(--color-1); font-family: var(--font-serif); text-align: right; }
        .h-twd { font-size: 12px; color: var(--color-2); display: block; font-weight: 500; margin-top: 4px; text-align: right; opacity: 0.8;}
        
        .del-btn { color: var(--color-5); background: transparent; border: var(--border-width) solid transparent; font-size: 20px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition-speed); margin-left: 10px;}
        .del-btn:hover, .del-btn:active { color: var(--color-danger); border-color: var(--color-danger); background: rgba(160, 64, 0, 0.05); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--color-5); }
        .empty-state-icon { font-size: 48px; margin-bottom: 15px; opacity: 0.8; }
        .empty-state-text { font-size: 15px; font-weight: 600; line-height: 1.6; }

        /* Toast 通知系統 */
        .toast-container { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 9999; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { background: var(--color-1); color: var(--color-3); padding: 16px 20px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; border: 1px solid rgba(255,255,255,0.1); }
        .toast.hide { animation: toastOut 0.3s ease-in forwards; }
        .toast.success { border-left: 4px solid var(--color-success); }
        .toast.error { border-left: 4px solid var(--color-danger); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(10px) scale(0.95); } }
        
        /* 隱藏其他非記帳區塊的 CSS 以保持範例乾淨，實作時請保留上一版 Flight / Itinerary 的 CSS */
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="header-info">
            <div class="app-title">廈門旅遊 <span class="refresh-btn" onclick="forceAppUpdate()">🔄</span></div>
            <div id="weather-badge" class="weather-badge" onclick="fetchXiamenWeather()">🇨🇳 載入中...</div>
        </div>
        
        <nav class="nav-bar-row">
            <button class="nav-btn active" id="btn-accounting">記帳</button>
            <button class="nav-btn" onclick="alert('為專注展示記帳功能，此版省略航班與行程代碼，請保留上一版的 HTML 區塊')">行程航班</button>
        </nav>
    </header>

    <main>
        <section id="view-accounting" class="view-container active">
            <div class="balance-card">
                <div class="rate-tag" id="rate-display">匯率: --</div>
                <div class="balance-label">Total Expense</div>
                <div class="balance-amount" id="total-primary">NT$ 0</div>
                <div class="balance-sub" id="total-secondary">≈ ¥ 0</div>
                
                <div class="budget-container">
                    <div class="budget-tot-row">總預算 NT$ 30,000</div>
                    <div class="budget-track"><div class="budget-fill" id="budget-fill"></div></div>
                    <div class="budget-rem-row" id="budget-rem-row">剩餘 NT$ 30,000</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box active-filter" id="filter-all" onclick="setFilter('All')">
                        <div class="stat-box-title">📊 總計顯示中</div>
                    </div>
                    <div style="visibility:hidden"></div>
                    
                    <div class="stat-box" id="filter-交通" onclick="setFilter('交通')">
                        <div class="stat-box-title">🚕 交通</div><div class="stat-box-val" id="stat-transport">NT$ 0</div>
                    </div>
                    <div class="stat-box" id="filter-食物" onclick="setFilter('食物')">
                        <div class="stat-box-title">🍔 食物</div><div class="stat-box-val" id="stat-food">NT$ 0</div>
                    </div>
                    <div class="stat-box" id="filter-購物" onclick="setFilter('購物')">
                        <div class="stat-box-title">🛍️ 購物</div><div class="stat-box-val" id="stat-shopping">NT$ 0</div>
                    </div>
                    <div class="stat-box" id="filter-其他" onclick="setFilter('其他')">
                        <div class="stat-box-title">✨ 其他</div><div class="stat-box-val" id="stat-other">NT$ 0</div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <span class="input-title">📅 日期</span>
                <div class="scroll-container">
                    <button class="chip active" onclick="selectDate('4/24')">4/24</button>
                    <button class="chip" onclick="selectDate('4/25')">4/25</button>
                    <button class="chip" onclick="selectDate('4/26')">4/26</button>
                    <button class="chip" onclick="selectDate('4/27')">4/27</button>
                </div>

                <span class="input-title">👤 是誰的花費？ (可多選/可不選)</span>
                <div class="scroll-container" id="person-container">
                    <button class="chip active" onclick="selectPerson('共用')">大家共用</button>
                    <button class="chip" onclick="selectPerson('爸爸')">爸爸</button>
                    <button class="chip" onclick="selectPerson('媽媽')">媽媽</button>
                    <button class="chip" onclick="selectPerson('我')">自己</button>
                </div>

                <div class="cat-row" style="margin-top: 15px;">
                    <button class="cat-btn active" onclick="selectCategory('交通')"><span class="cat-emoji">🚕</span>交通</button>
                    <button class="cat-btn" onclick="selectCategory('食物')"><span class="cat-emoji">🍔</span>食物</button>
                    <button class="cat-btn" onclick="selectCategory('購物')"><span class="cat-emoji">🛍️</span>購物</button>
                    <button class="cat-btn" onclick="selectCategory('其他')"><span class="cat-emoji">✨</span>其他</button>
                </div>
                
                <div class="input-group">
                    <input type="text" id="item-name" class="modern-input" placeholder="寫下品項 (選填)" style="border-bottom: var(--border-width) solid var(--color-1);">
                    <div class="curr-btn-row">
                        <div id="btn-curr-rmb" class="curr-btn active" onclick="selectCurrency('RMB')">¥ 人民幣</div>
                        <div id="btn-curr-twd" class="curr-btn" onclick="selectCurrency('TWD')">$ 新台幣</div>
                    </div>
                    <input type="number" id="item-price" class="modern-input" placeholder="輸入金額 (¥)" min="0" step="0.01">
                </div>
                
                <button onclick="addExpense()" id="btn-add" class="add-btn"><span>📝</span> 記錄一筆</button>
            </div>
            
            <div id="expense-list">
                <div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-text">正在同步帳本資料...</div></div>
            </div>
        </section>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVVY1EqQrjndhkeej_NIabBYYjNORHcRkaoev-wRGcWsRdO6HnvVrXg7BIIEHUYrVP/exec';
        const TOTAL_BUDGET = 30000;
        const TRIP_DATES = ['4/24', '4/25', '4/26', '4/27'];
        const EMOJI_MAP = { '交通': '🚕', '食物': '🍔', '購物': '🛍️', '其他': '✨' };
        
        const DOM = {
            rateDisplay: document.getElementById('rate-display'),
            expenseList: document.getElementById('expense-list'),
            totalPrimary: document.getElementById('total-primary'),
            totalSecondary: document.getElementById('total-secondary'),
            budgetRemRow: document.getElementById('budget-rem-row'),
            budgetFill: document.getElementById('budget-fill'),
            itemName: document.getElementById('item-name'),
            itemPrice: document.getElementById('item-price'),
            btnAdd: document.getElementById('btn-add'),
            toastContainer: document.getElementById('toast-container'),
            stats: {
                '交通': document.getElementById('stat-transport'),
                '食物': document.getElementById('stat-food'),
                '購物': document.getElementById('stat-shopping'),
                '其他': document.getElementById('stat-other')
            }
        };

        let currentRate = 4.45; 
        let expenses = []; 
        let appState = { 
            date: '4/24', 
            category: '交通', 
            currency: 'RMB',
            person: '共用', 
            activeFilter: 'All' // 目前過濾狀態
        };

        function showToast(message, type = 'default') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'success' ? '✅' : (type === 'error' ? '⚠️' : 'ℹ️');
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            DOM.toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                toast.addEventListener('animationend', () => toast.remove());
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchExchangeRate(); 
            fetchExpenses();
        });

        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/CNY');
                const data = await res.json();
                if (data?.rates?.TWD) {
                    currentRate = data.rates.TWD;
                    DOM.rateDisplay.innerText = `匯率: ${currentRate.toFixed(2)}`;
                    renderExpenses(); 
                }
            } catch (e) { DOM.rateDisplay.innerText = `參考匯率: ${currentRate}`; }
        }

        async function fetchExpenses() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=read`);
                expenses = await res.json(); 
                renderExpenses();
            } catch (err) {
                if(expenses.length === 0) DOM.expenseList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📡</div><div class="empty-state-text">連線失敗請重試</div></div>`;
                showToast('讀取資料失敗', 'error');
            }
        }

        async function addExpense() {
            let baseName = DOM.itemName.value.trim() || appState.category;
            const inputPrice = parseFloat(DOM.itemPrice.value); 
            
            if (isNaN(inputPrice) || inputPrice <= 0) { 
                showToast('請輸入有效的金額！', 'error'); return; 
            }
            
            // Pragmatic 做法：將成員名稱寫入 Name 字串中，不需修改後端
            let finalName = baseName;
            if (appState.person !== '共用') {
                finalName = `【${appState.person}】${baseName}`;
            }

            const finalPriceTWD = appState.currency === 'RMB' ? Math.round(inputPrice * currentRate) : Math.round(inputPrice); 
            
            const formData = new URLSearchParams({
                action: 'add', id: Date.now(), date: appState.date,
                cat: appState.category, name: finalName, price: finalPriceTWD
            });

            DOM.btnAdd.disabled = true; 
            DOM.btnAdd.innerHTML = '⏳ 儲存中...';

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: formData });
                
                // 【連續記帳優化】：只清空名稱與金額，不重置分類與日期！
                DOM.itemName.value = ''; 
                DOM.itemPrice.value = ''; 
                DOM.itemPrice.focus(); // 讓游標停留在金額框
                
                showToast(`已新增一筆花費！可繼續輸入下一筆`, 'success');
                await fetchExpenses();
            } catch (err) { 
                showToast('新增失敗！請確認網路連線', 'error'); 
            } finally { 
                DOM.btnAdd.disabled = false; 
                DOM.btnAdd.innerHTML = `<span>📝</span> 記錄一筆`; 
            }
        }

        async function deleteExpense(id) {
            if(!confirm('確定刪除此筆紀錄？')) return;
            const formData = new URLSearchParams({ action: 'delete', id });
            const originalExpenses = [...expenses]; 
            expenses = expenses.filter(item => item.id != id); 
            renderExpenses(); 

            try { 
                await fetch(SCRIPT_URL, { method: 'POST', body: formData }); 
                showToast('紀錄已刪除', 'success');
                fetchExpenses(); 
            } catch (err) { 
                expenses = originalExpenses; 
                renderExpenses(); 
            }
        }

        const escapeHTML = str => String(str).replace(/[&<>'"]/g, tag => ({ '&': '&', '<': '<', '>': '>', "'": '&#39;', '"': '&quot;' }[tag]));

        function renderExpenses() {
            let grandTotalTWD = 0; 
            let statsTWD = { '交通': 0, '食物': 0, '購物': 0, '其他': 0 };
            const fragment = document.createDocumentFragment();
            let hasRenderedAny = false;

            // 若目前有套用過濾，顯示過濾提示
            if (appState.activeFilter !== 'All') {
                document.getElementById('filter-all').style.display = 'block';
                document.getElementById('filter-all').querySelector('.stat-box-title').innerHTML = `✖️ 清除「${appState.activeFilter}」過濾`;
            } else {
                document.getElementById('filter-all').style.display = 'none';
            }

            TRIP_DATES.forEach((date, index) => {
                const dailyItems = expenses.filter(item => {
                    const sheetDate = String(item.date).trim();
                    let isMatchDate = (sheetDate === date || sheetDate.includes(date) || (sheetDate.includes('T') && `${new Date(sheetDate).getMonth() + 1}/${new Date(sheetDate).getDate()}` === date));
                    
                    // 過濾功能核心
                    let isMatchFilter = (appState.activeFilter === 'All' || item.cat === appState.activeFilter);
                    
                    return isMatchDate && isMatchFilter;
                });

                if (dailyItems.length > 0) {
                    hasRenderedAny = true;
                    
                    // 建立可折疊的日期區塊
                    const section = document.createElement('div');
                    section.className = 'date-section';
                    // 預設展開最新的一天（或套用過濾時全展開）
                    if (appState.activeFilter === 'All' && index < TRIP_DATES.indexOf(appState.date) - 1 ) {
                        section.classList.add('collapsed'); 
                    }

                    const divider = document.createElement('div'); 
                    divider.className = 'date-divider'; 
                    divider.textContent = date; 
                    divider.onclick = () => section.classList.toggle('collapsed'); // 點擊折疊/展開
                    section.appendChild(divider);

                    const wrapper = document.createElement('div');
                    wrapper.className = 'history-items-wrapper';

                    dailyItems.forEach(item => {
                        const twdValue = Math.round(parseFloat(item.price));
                        // 統計總金額 (不受過濾影響，顯示整體進度)
                        if(appState.activeFilter === 'All') {
                            grandTotalTWD += twdValue;
                            statsTWD[item.cat] = (statsTWD[item.cat] || 0) + twdValue;
                        }

                        const rmbValue = (twdValue / currentRate).toFixed(1);
                        let safeName = escapeHTML(item.name); 
                        const emoji = EMOJI_MAP[item.cat] || EMOJI_MAP['其他'];

                        // 解析「專屬成員標籤」 【爸爸】
                        let personTagHtml = '';
                        const tagMatch = safeName.match(/^【(.*?)】(.*)/);
                        if (tagMatch) {
                            personTagHtml = `<span class="h-tag">${tagMatch[1]}</span>`;
                            safeName = tagMatch[2].trim(); // 去除標籤後的乾淨品名
                        }

                        const div = document.createElement('div'); 
                        div.className = 'history-item';
                        div.innerHTML = `
                            <div>
                                <div class="h-name">${emoji} ${safeName} ${personTagHtml}</div>
                                <div class="h-cat">${item.cat}</div>
                            </div>
                            <div style="display:flex; align-items:center;">
                                <div>
                                    <div class="h-price">NT$ ${twdValue.toLocaleString()}</div>
                                    <span class="h-twd">≈ ¥ ${rmbValue}</span>
                                </div>
                                <button class="del-btn" onclick="deleteExpense(${item.id})">×</button>
                            </div>`;
                        wrapper.appendChild(div);
                    });
                    
                    section.appendChild(wrapper);
                    fragment.appendChild(section);
                }
            });

            DOM.expenseList.innerHTML = '';
            if (!hasRenderedAny) {
                DOM.expenseList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🍃</div><div class="empty-state-text">${appState.activeFilter === 'All' ? '目前沒有記帳資料' : `這天沒有 ${appState.activeFilter} 的花費`}</div></div>`;
            } else {
                DOM.expenseList.appendChild(fragment);
            }

            // 只有在顯示全部時才重算進度條，避免過濾時預算條亂跳
            if (appState.activeFilter === 'All') updateStats(grandTotalTWD, statsTWD);
        }

        function updateStats(totalTWD, statsTWD) {
            const displayTotalRMB = (totalTWD / currentRate).toFixed(1);
            let remaining = TOTAL_BUDGET - totalTWD;
            let spentPercent = Math.min(100, Math.max(0, (totalTWD / TOTAL_BUDGET) * 100));
            
            DOM.totalPrimary.textContent = `NT$ ${totalTWD.toLocaleString()}`;
            DOM.totalSecondary.textContent = `≈ ¥ ${displayTotalRMB}`;
            
            DOM.budgetRemRow.textContent = remaining < 0 ? `超支 NT$ ${Math.abs(remaining).toLocaleString()}` : `剩餘 NT$ ${remaining.toLocaleString()}`;
            DOM.budgetRemRow.style.color = remaining < 0 ? 'var(--color-danger)' : (spentPercent > 85 ? 'var(--color-2)' : 'var(--color-1)');
            DOM.budgetFill.style.backgroundColor = remaining < 0 ? 'var(--color-danger)' : (spentPercent > 85 ? 'var(--color-warning)' : 'var(--color-success)');
            DOM.budgetFill.style.width = `${spentPercent}%`;

            Object.keys(DOM.stats).forEach(cat => { DOM.stats[cat].textContent = `NT$ ${(statsTWD[cat] || 0).toLocaleString()}`; });
        }

        // --- 互動控制 ---
        function setFilter(cat) {
            appState.activeFilter = (appState.activeFilter === cat || cat === 'All') ? 'All' : cat;
            document.querySelectorAll('.stat-box').forEach(box => box.classList.remove('active-filter'));
            if (appState.activeFilter !== 'All') document.getElementById(`filter-${appState.activeFilter}`).classList.add('active-filter');
            renderExpenses();
        }

        function selectCurrency(curr) {
            appState.currency = curr;
            document.getElementById('btn-curr-rmb').classList.toggle('active', curr === 'RMB');
            document.getElementById('btn-curr-twd').classList.toggle('active', curr === 'TWD');
            DOM.itemPrice.placeholder = curr === 'RMB' ? "輸入金額 (¥)" : "輸入金額 ($)";
        }

        function selectDate(date) { 
            appState.date = date; 
            document.querySelectorAll('.date-scroll-container .chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent.includes(date));
            });
        }

        function selectPerson(person) { 
            appState.person = person; 
            const container = document.getElementById('person-container');
            container.querySelectorAll('.chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent.includes(person) || (person==='共用' && chip.textContent==='大家共用'));
            });
        }

        function selectCategory(cat) { 
            appState.category = cat; 
            document.querySelectorAll('.cat-btn').forEach(btn => { 
                btn.classList.toggle('active', btn.textContent.includes(cat));
            }); 
        }
    </script>
</body>
</html>
