<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>廈門旅遊 2026</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#d8d8d0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* =========================================
           1. 高級原生 App 變數設定
           ========================================= */
        :root {
            --bg-color: #d8d8d0;         
            --card-bg: #FCFAFA;          
            --primary: #713e18;          
            --primary-light: rgba(113, 62, 24, 0.08); 
            --secondary: #b78f64;        
            --accent: #f4c07d;           
            --text-main: #382615;        
            --text-muted: #857262;       
            --border-color: rgba(56, 38, 21, 0.1);
            
            --color-success: #6b8c65;
            --color-danger: #A04000;
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            
            --shadow-card: 0 8px 24px rgba(56, 38, 21, 0.06), 0 2px 8px rgba(56, 38, 21, 0.03);
            --shadow-btn: 0 6px 16px rgba(113, 62, 24, 0.2);
            --border-inner: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            
            --font-sans: 'Inter', 'Noto Sans TC', sans-serif;
            --font-serif: 'Noto Serif TC', serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: var(--font-sans); }

        body { 
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overscroll-behavior-y: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
        }

        button, input, select { appearance: none; -webkit-appearance: none; border: none; background: none; outline: none; margin: 0; padding: 0; }
        button { cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.2s; }
        button:active { transform: scale(0.96); opacity: 0.8; }

        /* =========================================
           2. 頂部狀態列
           ========================================= */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(216, 216, 208, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: calc(16px + env(safe-area-inset-top)) 24px 16px;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .app-header h1 { margin: 0; font-family: var(--font-serif); font-size: 28px; font-weight: 900; color: var(--text-main); letter-spacing: 0.5px; }
        .app-header .subtitle { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-top: 4px; display: block; letter-spacing: 1px; text-transform: uppercase;}
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .weather-pill { background: var(--card-bg); padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; box-shadow: var(--border-inner), var(--shadow-card); display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color);}
        .refresh-fab { background: var(--card-bg); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--border-inner), var(--shadow-card); color: var(--text-main); font-size: 18px; border: 1px solid var(--border-color);}

        /* =========================================
           3. 底部導覽列
           ========================================= */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(252, 250, 250, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(56, 38, 21, 0.05); z-index: 999;
            display: flex; justify-content: space-around; padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
        }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); }
        .tab-btn i { font-size: 24px; transition: 0.2s; }
        .tab-btn span { font-size: 11px; font-weight: 700; }
        .tab-btn.active { color: var(--primary); }

        /* =========================================
           4. 視圖容器
           ========================================= */
        .view-container { 
            display: none; 
            padding: 15px 20px 120px; 
            flex-direction: column; 
            gap: 20px; 
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .view-container.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); filter: blur(4px);} to { opacity: 1; transform: translateY(0); filter: blur(0);} }

        /* 確保卡片間距由 flex gap 控制 */
        .balance-card, .segment-wrapper, .bento-grid, .input-composite, .trip-card, .flight-card { margin: 0 !important; }

        /* =========================================
           5. 記帳與餘額 (含獨立的分類統計按鈕)
           ========================================= */
        .balance-card {
            background: linear-gradient(135deg, #382615 0%, #20140A 100%);
            border-radius: var(--radius-lg); padding: 24px; color: #FFF; 
            box-shadow: 0 16px 32px rgba(56, 38, 21, 0.2); position: relative; overflow: hidden;
        }
        .b-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 1px; position: relative; z-index: 2;}
        .rate-badge { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 8px; font-size: 11px; color: var(--accent); border: 1px solid rgba(244, 192, 125, 0.2);}
        
        .b-amount { font-family: var(--font-serif); font-size: 42px; font-weight: 900; margin: 8px 0 4px; line-height: 1.1; background: linear-gradient(135deg, #FFF 0%, #E2DDD5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; position: relative; z-index: 2;}
        .b-sub { font-size: 15px; color: var(--secondary); font-weight: 600; position: relative; z-index: 2;}

        .budget-wrapper { margin-top: 20px; position: relative; z-index: 2;}
        .budget-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
        .budget-track { height: 6px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
        .budget-fill { height: 100%; width: 0%; background: var(--color-success); border-radius: 99px; transition: width 1s ease; }

        /* 🌟 新增：明顯的分類花費統計按鈕 */
        .open-stats-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: rgba(244, 192, 125, 0.15);
            border: 1px solid rgba(244, 192, 125, 0.3);
            color: var(--accent);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            position: relative;
            z-index: 2;
            letter-spacing: 1px;
        }
        .open-stats-btn:active {
            background: rgba(244, 192, 125, 0.25);
            transform: scale(0.98);
        }

        .segment-wrapper { background: rgba(56, 38, 21, 0.06); border-radius: 12px; display: flex; padding: 4px; box-shadow: inset 0 1px 3px rgba(56, 38, 21, 0.05);}
        .seg-btn { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); border-radius: 8px; transition: 0.3s; }
        .seg-btn.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(56, 38, 21, 0.08); }

        /* 便當盒網格 */
        .section-title { font-size: 15px; font-weight: 800; margin: 5px 0 -10px; color: var(--text-main); }
        .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .bento-box { background: var(--card-bg); border-radius: var(--radius-md); padding: 16px; text-align: center; border: 1px solid var(--border-color); box-shadow: var(--border-inner), var(--shadow-card); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s;}
        .bento-box.active { border: 2px solid var(--primary); color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(113, 62, 24, 0.12);}
        .bento-icon { font-size: 32px; display: block; margin-bottom: 8px; color: var(--text-muted); transition: 0.2s;}
        .bento-box.active .bento-icon { color: var(--primary); transform: scale(1.1);}
        .bento-label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .bento-box.active .bento-label { color: var(--primary); }

        /* 輸入框組件 */
        .input-composite { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color); }
        .input-row { display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 12px; }
        .input-row input { flex: 1; font-size: 16px; font-weight: 600; color: var(--text-main); }
        .input-row input::placeholder { color: #B4ACA6; font-weight: 500;}
        .price-action-row { display: flex; align-items: center; justify-content: space-between; }
        .price-input-wrapper { display: flex; align-items: center; background: var(--bg-color); border-radius: 12px; padding: 12px 16px; flex: 1; margin-right: 12px; border: inset 1px rgba(0,0,0,0.02);}
        .curr-toggle { font-weight: 800; font-size: 20px; color: var(--primary); margin-right: 12px; padding-right: 12px; border-right: 2px solid rgba(56, 38, 21, 0.15); cursor: pointer; transition: 0.2s;}
        .price-input-wrapper input { font-size: 24px; font-weight: 800; width: 100%; color: var(--text-main); }
        .price-input-wrapper input::placeholder { color: #B4ACA6; font-weight: 500;}
        .submit-fab { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg, var(--primary) 0%, #5A3113 100%); color: #FFF; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), var(--shadow-btn); flex-shrink: 0;}

        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .h-item { background: var(--card-bg); padding: 16px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); box-shadow: var(--shadow-card);}
        .h-left { display: flex; align-items: center; gap: 12px; }
        .h-icon { width: 44px; height: 44px; background: var(--bg-color); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .h-info h4 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
        .h-tag { font-size: 10px; background: var(--accent); color: var(--text-main); padding: 3px 6px; border-radius: 4px; font-weight: 800; letter-spacing: 0.5px;}
        .h-right { text-align: right; }
        .h-price { font-family: var(--font-serif); font-size: 18px; font-weight: 900; color: var(--primary); margin-bottom: 2px;}
        .h-jpy { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .h-del { color: var(--text-muted); padding: 10px; margin-left: 5px; font-size: 20px; transition: 0.2s;}
        .h-del:active { color: var(--color-danger); }

        /* =========================================
           6. 行程版面 (獨立區塊、地鐵動線)
           ========================================= */
        .trip-card { background: var(--card-bg); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color);}
        .t-img { width: 100%; height: 200px; object-fit: cover; filter: sepia(0.1) contrast(0.95);}
        .t-body { padding: 24px; }
        .t-time { font-size: 11px; font-weight: 800; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
        .t-title { font-family: var(--font-serif); font-size: 24px; font-weight: 900; margin: 0 0 20px; line-height: 1.3; color: var(--text-main); }
        
        .info-block {
            display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start; padding: 14px;
            background: rgba(255,255,255,0.8); border-radius: 12px; border: 1px solid var(--border-color);
        }
        .info-block.addr-block { background: rgba(255,255,255,0.5); }
        .info-block.transport-block { background: rgba(183, 143, 100, 0.08); border-color: rgba(183, 143, 100, 0.2); }
        .info-block.note-block { background: rgba(244, 192, 125, 0.15); border-color: rgba(244, 192, 125, 0.3); }
        
        .i-icon { font-size: 22px; color: var(--secondary); margin-top: 2px; }
        .transport-block .i-icon { color: var(--primary); }
        .note-block .i-icon { color: var(--primary); }
        .i-text { flex: 1; font-size: 14px; font-weight: 600; color: var(--text-main); line-height: 1.6; }
        
        .copy-addr-btn { 
            background: rgba(56, 38, 21, 0.06); border: 1px solid rgba(56, 38, 21, 0.1); color: var(--text-main); 
            font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 6px; margin-left: 8px; 
            display: inline-flex; align-items: center; gap: 4px; vertical-align: text-bottom; transition: 0.2s; margin-top: 4px;
        }
        .copy-addr-btn:active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .subway-step { 
            display: block; position: relative; padding-left: 16px; margin-bottom: 10px; border-left: 2px solid var(--border-color); line-height: 1.5;
        }
        .subway-step:last-child { border-left-color: transparent; margin-bottom: 0; }
        .subway-step::before { content: ''; position: absolute; left: -5px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); border: 2px solid #fff; }
        .subway-station { font-weight: 800; color: var(--text-main); background: #fff; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px; margin: 0 4px; display: inline-block;}
        .subway-line { color: var(--primary); font-weight: 800; font-size: 13px; }

        .cost-tag { display: inline-block; background-color: #fff; color: var(--primary); padding: 4px 8px; font-size: 12px; font-weight: 800; border-radius: 6px; margin-top: 10px; border: 1px solid rgba(113, 62, 24, 0.2); letter-spacing: 0.5px; }
        .map-btn { display: block; width: 100%; text-align: center; background: var(--text-main); color: #FFF; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 14px; text-decoration: none; margin-top: 20px; transition: 0.2s;}
        .map-btn:active { background: var(--primary); }

        /* =========================================
           7. 機票版面
           ========================================= */
        .flight-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color); border-top: 6px solid var(--primary); }
        .f-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .f-code { font-family: var(--font-serif); font-size: 36px; font-weight: 900; display: block; letter-spacing: -1px; color: var(--text-main); line-height: 1.1;}
        .f-city { font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}
        .f-icon { font-size: 32px; color: var(--secondary); transform: rotate(45deg); opacity: 0.5; }
        .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: var(--bg-color); padding: 16px; border-radius: 12px; margin-bottom: 16px; border: inset 1px rgba(0,0,0,0.02);}
        .f-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block; letter-spacing: 0.5px;}
        .f-val { font-size: 16px; font-weight: 800; color: var(--text-main); }

        /* Modal / Toast */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(56, 38, 21, 0.4); backdrop-filter: blur(8px); z-index: 2000; opacity: 0; pointer-events: none; transition: 0.3s; display: flex; align-items: flex-end; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card { background: var(--bg-color); width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); box-shadow: 0 -10px 40px rgba(56, 38, 21, 0.2);}
        .modal-overlay.active .modal-card { transform: translateY(0); }
        
        .pull-indicator { width: 40px; height: 5px; background: rgba(56,38,21,0.2); border-radius: 3px; margin: 0 auto 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h3 { margin: 0; font-family: var(--font-serif); font-size: 22px; font-weight: 900; color: var(--text-main); }
        .close-btn { background: rgba(56,38,21,0.06); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-main); font-size: 16px; }
        
        .stat-item { background: var(--card-bg); padding: 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color); }
        .stat-left { display: flex; align-items: center; gap: 14px; }
        .stat-icon { width: 48px; height: 48px; background: var(--bg-color); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .stat-info h4 { margin: 0 0 4px; font-size: 15px; font-weight: 700; color: var(--text-main); }
        .stat-percent { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .stat-right { text-align: right; }
        .s-twd { font-family: var(--font-serif); font-size: 18px; font-weight: 900; color: var(--text-main); display: block; margin-bottom: 2px;}
        .s-jpy { font-size: 12px; font-weight: 600; color: var(--secondary); }

        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; pointer-events: none;}
        .toast { background: rgba(56, 38, 21, 0.9); backdrop-filter: blur(12px); color: #FFF; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(56,38,21,0.3); display: flex; align-items: center; gap: 12px; animation: toastIn 0.3s forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="app-header">
        <div>
            <h1>Xiamen 2026</h1>
            <span class="subtitle">4月24日 - 4月27日</span>
        </div>
        <div class="header-actions">
            <button class="refresh-fab" onclick="manualSync()"><i class="ph-bold ph-arrows-clockwise"></i></button>
            <div class="weather-pill" id="weather-badge" onclick="fetchXiamenWeather()">🇨🇳 載入中</div>
        </div>
    </header>

    <main>
        <section id="view-accounting" class="view-container active">
            <div class="balance-card">
                <div class="b-title">
                    <span>Total Expenses</span>
                    <span class="rate-badge" id="rate-display">匯率 4.45</span>
                </div>
                <h2 class="b-amount" id="total-primary">NT$ 0</h2>
                <div class="b-sub" id="total-secondary">≈ ¥ 0</div>
                <div class="budget-wrapper">
                    <div class="budget-info">
                        <span id="budget-rem-label">剩餘 NT$ 30,000</span>
                        <span class="budget-tot">/ 30k 預算</span>
                    </div>
                    <div class="budget-track"><div class="budget-fill" id="budget-fill"></div></div>
                </div>
                
                <button class="open-stats-btn" onclick="openStatsModal()">
                    <i class="ph-bold ph-chart-pie-slice"></i> 查看分類花費統計
                </button>
            </div>

            <div class="segment-wrapper" id="date-segment">
                <button class="seg-btn active" onclick="selectDate('4/24', this)">4/24</button>
                <button class="seg-btn" onclick="selectDate('4/25', this)">4/25</button>
                <button class="seg-btn" onclick="selectDate('4/26', this)">4/26</button>
                <button class="seg-btn" onclick="selectDate('4/27', this)">4/27</button>
            </div>

            <div class="segment-wrapper" id="person-segment">
                <button class="seg-btn active" onclick="selectPerson('', this)">👥 共用</button>
                <button class="seg-btn" onclick="selectPerson('小爸', this)">🦭 小爸</button>
                <button class="seg-btn" onclick="selectPerson('阿馨', this)">🐹 阿馨</button>
                <button class="seg-btn" onclick="selectPerson('阿雪', this)">🐵 阿雪</button>
            </div>

            <h3 class="section-title">選擇分類</h3>
            <div class="bento-grid" id="category-container">
                <button class="bento-box active" onclick="selectCategory('交通', this)"><i class="ph-fill ph-taxi bento-icon"></i><span class="bento-label">交通</span></button>
                <button class="bento-box" onclick="selectCategory('食物', this)"><i class="ph-fill ph-hamburger bento-icon"></i><span class="bento-label">食物</span></button>
                <button class="bento-box" onclick="selectCategory('購物', this)"><i class="ph-fill ph-tote bento-icon"></i><span class="bento-label">購物</span></button>
                <button class="bento-box" onclick="selectCategory('其他', this)"><i class="ph-fill ph-sparkle bento-icon"></i><span class="bento-label">其他</span></button>
            </div>

            <h3 class="section-title">記下一筆</h3>

        // UI 邏輯
        function switchTab(tabId) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        function switchDay(day, el) {

        function toggleCurrency() {
            const toggleBtn = document.getElementById('curr-toggle');
            if (Store.state.currency === 'RMB') {
                Store.state.currency = 'TWD';
                toggleBtn.innerText = '$';
                document.getElementById('item-price').placeholder = "輸入台幣";
            } else {
                Store.state.currency = 'RMB';
                toggleBtn.innerText = '¥';
                document.getElementById('item-price').placeholder = "輸入人民幣";
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast('地址已複製'));

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="ph-bold ph-check"></i> <span>${msg}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

                let noteHtml = '';
                if(item.info2) {
                    noteHtml = `
                    <div class="info-block note-block">
                        <div class="i-icon">${item.icon2}</div>
                        <div class="i-text">${item.info2}</div>
                    </div>`;
                }

                html += `
                <div class="trip-card">
                    <img src="${item.imgUrl}" class="t-img" loading="lazy">
                    <div class="t-body">
                        <span class="t-time">${item.time}</span>
                        <h3 class="t-title">${item.title}</h3>
                        
                        <div class="info-block addr-block">

                        </div>

                            <div class="i-text">${item.info1}</div>

                        <div><span class="f-code">${f.fCode}</span><span class="f-city">${f.fromName}</span></div>
                        <i class="ph-fill ph-airplane-tilt f-icon"></i>

                    </div>
                    <div class="f-grid">
                        <div><span class="f-label">日期</span><span class="f-val">${f.date}</span></div>
                        <div><span class="f-label">班機</span><span class="f-val">${f.air}</span></div>
                        <div><span class="f-label">起飛</span><span class="f-val">${f.dTime}</span></div>

                </div>`;

        }

        function renderExpenses() {
            let totalTWD = 0;
            const listEl = document.getElementById('expense-list');
            listEl.innerHTML = '';
            const todayItems = Store.state.expenses.filter(item => {
                const sheetDate = String(item.date).trim();
                const targetDate = Store.state.date;
                if (sheetDate.includes(targetDate)) return true;
                if (sheetDate.includes('T')) {
                    const d = new Date(sheetDate);
                    return `${d.getMonth() + 1}/${d.getDate()}` === targetDate;
                }
                return false;
            });

            todayItems.forEach(item => {
                const price = Math.round(parseFloat(item.price));
                const icon = EMOJI_MAP[item.cat] || 'ph-sparkle';
                listEl.innerHTML += `
                <div class="h-item">
                    <div class="h-left">
                        <div class="h-icon"><i class="ph-fill ${icon}"></i></div>
                        <div class="h-info">
                            <h4>${item.name}</h4>
                            <span class="h-jpy">${item.cat}</span>
                        </div>
                    </div>
                    <div class="h-right">
                        <div class="h-price">$${price}</div>
                        <button onclick="deleteExpense('${item.id}')" style="color:var(--text-muted); padding:4px; border:none; background:none;"><i class="ph-bold ph-trash"></i></button>
                    </div>
                </div>`;
            });

            Store.state.expenses.forEach(item => { totalTWD += Math.round(parseFloat(item.price) || 0); });
            const totalRMB = (totalTWD / Store.state.rate).toFixed(1);
            document.getElementById('total-primary').innerText = `NT$ ${totalTWD.toLocaleString()}`;
            document.getElementById('total-secondary').innerText = `≈ ¥ ${totalRMB}`;

            let spentPercent = (totalTWD / TOTAL_BUDGET) * 100;
            let remaining = TOTAL_BUDGET - totalTWD;
            document.getElementById('budget-fill').style.width = `${Math.min(spentPercent, 100)}%`;
            document.getElementById('budget-rem-label').innerText = remaining >= 0 ? `剩餘 NT$ ${remaining.toLocaleString()}` : `超支 NT$ ${Math.abs(remaining).toLocaleString()}`;
        }

        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/CNY');
                const data = await res.json();
                if (data?.rates?.TWD) Store.updateRate(data.rates.TWD);
                document.getElementById('rate-display').innerText = `匯率 ${Store.state.rate.toFixed(2)}`;
            } catch (e) {}
        }

        async function fetchXiamenWeather() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=24.4798&longitude=118.0894&current_weather=true&timezone=Asia%2FShanghai`);
                const data = await res.json();
                document.getElementById('weather-badge').innerHTML = `🇨🇳 廈門 ${Math.round(data.current_weather.temperature)}°C`;
            } catch (e) {}
        }

        async function fetchExpenses() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=read&t=${Date.now()}`);
                const data = await res.json();
                if (Array.isArray(data)) { Store.updateExpenses(data); renderExpenses(); }
            } catch (err) {}
        }

        async function addExpense() {
            const priceEl = document.getElementById('item-price');
            const inputPrice = parseFloat(priceEl.value);
            if (isNaN(inputPrice) || inputPrice <= 0) return;

            let finalName = (document.getElementById('item-name').value || Store.state.category);
            if (Store.state.person) finalName = `【${Store.state.person}】${finalName}`;
            const finalPriceTWD = Store.state.currency === 'RMB' ? Math.round(inputPrice * Store.state.rate) : Math.round(inputPrice);

            const newId = Date.now().toString();
            const newObj = { id: newId, date: Store.state.date, cat: Store.state.category, name: finalName, price: finalPriceTWD };
            Store.updateExpenses([...Store.state.expenses, newObj]);
            renderExpenses();
            priceEl.value = '';
            document.getElementById('item-name').value = '';
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'add', ...newObj }) });
                fetchExpenses();
            } catch (err) {}
        }

        async function deleteExpense(id) {
            if (!confirm('確定刪除？')) return;
            Store.updateExpenses(Store.state.expenses.filter(i => i.id !== id));
            renderExpenses();
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'delete', id }) });
                fetchExpenses();
            } catch (err) {}
        }

        function manualSync() { showToast('正在同步...'); fetchExpenses(); fetchExchangeRate(); }

        function openStatsModal() {
            const container = document.getElementById('stats-content');
            let stats = { '交通': 0, '食物': 0, '購物': 0, '其他': 0 };

            Store.state.expenses.forEach(item => {
                let price = Math.round(parseFloat(item.price) || 0);
                stats[item.cat] = (stats[item.cat] || 0) + price;
                totalTWD += price;
            });

            let html = '';
            const cats = ['交通', '食物', '購物', '其他'];
            cats.forEach(cat => {
                let valTWD = stats[cat];
                let valRMB = (valTWD / Store.state.rate).toFixed(1);
                let icon = EMOJI_MAP[cat] || 'ph-sparkle';
                let percent = totalTWD === 0 ? 0 : Math.round((valTWD / totalTWD) * 100);
                
                html += `
                <div class="stat-item">
                    <div class="stat-left">
                        <div class="stat-icon"><i class="ph-fill ${icon}"></i></div>
                        <div class="stat-info">
                            <h4>${cat}</h4>
                            <span class="stat-percent">${percent}% 佔比</span>
                        </div>
                    </div>
                    <div class="stat-right">
                        <span class="s-twd">$${valTWD.toLocaleString()}</span>
                        <span class="s-jpy">≈ ¥${valRMB}</span>
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
            document.getElementById('stats-modal').classList.add('active');
        }

        function closeStatsModal() {
            document.getElementById('stats-modal').classList.remove('active');
        }
    </script>
</body>
</html>
