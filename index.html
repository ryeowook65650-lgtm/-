<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Xiamen Trip 2026</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#d8d8d0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* =========================================
           1. 高級原生 App 變數設定 (Aman Resort / Wabi-Sabi Style)
           ========================================= */
        :root {
            /* 原始質感調色盤 */
            --bg-color: #d8d8d0;         /* 奶茶米 (底色) */
            --card-bg: #FCFAFA;          /* 乾淨白 (卡片) */
            --primary: #713e18;          /* 焦糖棕 (主要強調) */
            --primary-light: rgba(113, 62, 24, 0.08); 
            --secondary: #b78f64;        /* 淺沙棕 */
            --accent: #f4c07d;           /* 暖沙金 (高光/警示) */
            --text-main: #382615;        /* 深焙咖 (主文字) */
            --text-muted: #857262;       /* 柔和灰棕 */
            --border-color: rgba(56, 38, 21, 0.1);
            
            --color-success: #6b8c65;
            --color-danger: #A04000;
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            
            --shadow-card: 0 8px 24px rgba(56, 38, 21, 0.06), 0 2px 8px rgba(56, 38, 21, 0.03);
            --shadow-btn: 0 6px 16px rgba(113, 62, 24, 0.2);
            --border-inner: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            
            --font-sans: 'Inter', 'Noto Sans TC', sans-serif;
            --font-serif: 'Noto Serif TC', serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: var(--font-sans); }

        body { 
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overscroll-behavior-y: none;
            /* 細緻的高級紙張紋理 */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
        }

        button, input, select { appearance: none; -webkit-appearance: none; border: none; background: none; outline: none; margin: 0; padding: 0; }
        button { cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.2s; }
        button:active { transform: scale(0.94); opacity: 0.8; }

        /* =========================================
           2. 頂部狀態列 (Header)
           ========================================= */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(216, 216, 208, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: calc(16px + env(safe-area-inset-top)) 24px 16px;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .app-header h1 { margin: 0; font-family: var(--font-serif); font-size: 28px; font-weight: 900; color: var(--text-main); letter-spacing: 0.5px; }
        .app-header .subtitle { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-top: 4px; display: block; letter-spacing: 1px; text-transform: uppercase;}
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .weather-pill { background: var(--card-bg); padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; box-shadow: var(--border-inner), var(--shadow-card); display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color);}
        .refresh-fab { background: var(--card-bg); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--border-inner), var(--shadow-card); color: var(--text-main); font-size: 18px; border: 1px solid var(--border-color);}

        /* =========================================
           3. 底部導覽列 (Bottom Tab Bar)
           ========================================= */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(252, 250, 250, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(56, 38, 21, 0.05); z-index: 999;
            display: flex; justify-content: space-around; padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
        }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); }
        .tab-btn i { font-size: 24px; transition: 0.2s; }
        .tab-btn span { font-size: 11px; font-weight: 700; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active i { transform: translateY(-2px); }

        /* =========================================
           4. 視圖容器
           ========================================= */
        .view-container { display: none; padding: 0 20px; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .view-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); filter: blur(4px);} to { opacity: 1; transform: translateY(0); filter: blur(0);} }

        /* =========================================
           5. 記帳版面 (Bento Box 網格佈局)
           ========================================= */
        .balance-card {
            background: linear-gradient(135deg, #382615 0%, #20140A 100%);
            border-radius: var(--radius-lg); padding: 24px; color: #FFF; margin-top: 10px; margin-bottom: 24px;
            box-shadow: 0 16px 32px rgba(56, 38, 21, 0.2); position: relative; overflow: hidden;
        }
        .balance-card::before { content: ''; position: absolute; right: -30px; top: -30px; width: 150px; height: 150px; background: radial-gradient(circle, rgba(244, 192, 125, 0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none;}
        
        .b-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; text-transform: uppercase; letter-spacing: 1px;}
        .b-title-right { display: flex; align-items: center; gap: 8px; }
        .rate-badge { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 8px; font-size: 11px; backdrop-filter: blur(5px); color: var(--accent); border: 1px solid rgba(244, 192, 125, 0.2);}
        
        .stats-btn { background: rgba(255,255,255,0.1); border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 16px; backdrop-filter: blur(5px); border: 1px solid rgba(244, 192, 125, 0.2); }
        .stats-btn:active { background: rgba(255,255,255,0.25); }

        .b-amount { font-family: var(--font-serif); font-size: 42px; font-weight: 900; margin: 4px 0; letter-spacing: -1px; position: relative; z-index: 2; background: linear-gradient(135deg, #FFF 0%, #E2DDD5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .b-sub { font-size: 15px; color: var(--secondary); font-weight: 600; position: relative; z-index: 2;}

        .budget-wrapper { margin-top: 24px; position: relative; z-index: 2; }
        .budget-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
        .budget-tot { color: rgba(255,255,255,0.5); }
        .budget-track { height: 6px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);}
        .budget-fill { height: 100%; width: 0%; background: var(--color-success); border-radius: 99px; transition: width 1s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease; }

        .segment-wrapper { background: rgba(56, 38, 21, 0.06); border-radius: 12px; display: flex; padding: 4px; margin-bottom: 20px; box-shadow: inset 0 1px 3px rgba(56, 38, 21, 0.05);}
        .seg-btn { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); border-radius: 8px; transition: 0.3s; }
        .seg-btn.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(56, 38, 21, 0.08); }

        .section-title { font-size: 15px; font-weight: 800; margin: 0 0 12px; color: var(--text-main); }
        .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
        .bento-box { background: var(--card-bg); border-radius: var(--radius-md); padding: 16px; text-align: center; border: 1px solid var(--border-color); box-shadow: var(--border-inner), var(--shadow-card); transition: 0.2s; }
        .bento-box.active { border: 2px solid var(--primary); background: var(--card-bg); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(113, 62, 24, 0.12);}
        .bento-icon { font-size: 32px; display: block; margin-bottom: 8px; color: var(--text-muted); transition: 0.2s;}
        .bento-box.active .bento-icon { color: var(--primary); transform: scale(1.1);}
        .bento-label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .bento-box.active .bento-label { color: var(--primary); }

        .input-composite { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--border-inner), var(--shadow-card); margin-bottom: 30px; border: 1px solid var(--border-color); }
        .input-row { display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 12px; }
        .input-row input { flex: 1; font-size: 16px; font-weight: 600; padding: 8px; color: var(--text-main); }
        .input-row input::placeholder { color: #B4ACA6; font-weight: 500; }
        
        .price-action-row { display: flex; align-items: center; justify-content: space-between; }
        .price-input-wrapper { display: flex; align-items: center; background: var(--bg-color); border-radius: 12px; padding: 12px 16px; flex: 1; margin-right: 12px; border: inset 1px rgba(0,0,0,0.02);}
        .curr-toggle { font-weight: 800; font-size: 20px; color: var(--primary); margin-right: 12px; padding-right: 12px; border-right: 2px solid rgba(56, 38, 21, 0.15); cursor: pointer; transition: 0.2s; user-select: none; }
        .curr-toggle:active { transform: scale(0.85); opacity: 0.7; }
        .price-input-wrapper input { font-size: 24px; font-weight: 800; width: 100%; color: var(--text-main); }
        .price-input-wrapper input::placeholder { color: #B4ACA6; font-weight: 500;}
        .submit-fab { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg, var(--primary) 0%, #5A3113 100%); color: #FFF; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), var(--shadow-btn); flex-shrink: 0;}

        .history-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px;}
        .h-item { background: var(--card-bg); padding: 16px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-card); border: 1px solid var(--border-color); }
        .h-left { display: flex; align-items: center; gap: 12px; }
        .h-icon { width: 44px; height: 44px; background: var(--bg-color); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .h-info h4 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
        .h-tag { font-size: 10px; background: var(--accent); color: var(--text-main); padding: 3px 6px; border-radius: 4px; font-weight: 800; letter-spacing: 0.5px;}
        .h-right { text-align: right; }
        .h-price { font-family: var(--font-serif); font-size: 18px; font-weight: 900; color: var(--primary); margin-bottom: 2px; }
        .h-jpy { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .h-del { color: var(--text-muted); padding: 10px; margin-left: 5px; font-size: 20px; transition: 0.2s;}
        .h-del:active { color: var(--color-danger); }

        /* =========================================
           6. 行程與機票版面 (Editorial Layout)
           ========================================= */
        .trip-card { background: var(--card-bg); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color);}
        .t-img { width: 100%; height: 200px; object-fit: cover; filter: sepia(0.1) contrast(0.95);}
        .t-body { padding: 24px; }
        .t-time { font-size: 11px; font-weight: 800; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
        .t-title { font-family: var(--font-serif); font-size: 22px; font-weight: 900; margin: 0 0 16px; line-height: 1.4; color: var(--text-main); }
        .t-row { display: flex; gap: 12px; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: var(--text-muted); align-items: flex-start; }
        .t-row i { font-size: 20px; color: var(--secondary); }
        .map-btn { display: block; width: 100%; text-align: center; background: var(--bg-color); color: var(--text-main); padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; text-decoration: none; margin-top: 20px; transition: 0.2s; border: 1px solid var(--border-color);}
        .map-btn:active { background: #E2DDD5; }

        .flight-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color); border-top: 6px solid var(--primary); }
        .f-top { display: flex; justify-content: space-between; margin-bottom: 24px; }
        .f-code { font-family: var(--font-serif); font-size: 36px; font-weight: 900; display: block; letter-spacing: -1px;}
        .f-city { font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}
        .f-icon { font-size: 32px; color: var(--secondary); transform: rotate(45deg); opacity: 0.5; }
        .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: var(--bg-color); padding: 16px; border-radius: 12px; margin-bottom: 16px; border: inset 1px rgba(0,0,0,0.02);}
        .f-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block; letter-spacing: 0.5px;}
        .f-val { font-size: 16px; font-weight: 800; color: var(--text-main); }

        /* =========================================
           7. 底部彈出統計視窗 (Bottom Sheet Modal)
           ========================================= */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(56, 38, 21, 0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; 
            display: flex; align-items: flex-end; 
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card { 
            background: var(--bg-color); width: 100%; max-height: 85vh; overflow-y: auto;
            border-radius: 24px 24px 0 0; padding: 24px; 
            padding-bottom: calc(24px + env(safe-area-inset-bottom)); 
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); 
            box-shadow: 0 -10px 40px rgba(56, 38, 21, 0.2);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        
        .pull-indicator { width: 40px; height: 5px; background: rgba(56,38,21,0.2); border-radius: 3px; margin: 0 auto 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h3 { margin: 0; font-family: var(--font-serif); font-size: 22px; font-weight: 900; color: var(--text-main); }
        .close-btn { background: rgba(56,38,21,0.06); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-main); font-size: 16px; }
        
        .stat-item { background: var(--card-bg); padding: 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color); }
        .stat-left { display: flex; align-items: center; gap: 14px; }
        .stat-icon { width: 48px; height: 48px; background: var(--bg-color); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .stat-info h4 { margin: 0 0 4px; font-size: 15px; font-weight: 700; color: var(--text-main); }
        .stat-percent { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .stat-right { text-align: right; }
        .s-twd { font-family: var(--font-serif); font-size: 18px; font-weight: 900; color: var(--text-main); display: block; margin-bottom: 2px;}
        .s-jpy { font-size: 12px; font-weight: 600; color: var(--secondary); }

        /* Toast 提示 */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 9999; width: 90%; max-width: 350px; pointer-events: none;}
        .toast { background: rgba(56, 38, 21, 0.9); backdrop-filter: blur(12px); color: #FFF; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(56,38,21,0.3); animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast.hide { animation: toastOut 0.3s ease forwards; }
        .toast i { font-size: 20px; }
        .toast.success i { color: var(--accent); }
        .toast.error i { color: var(--color-danger); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body>

    <header class="app-header">
        <div>
            <h1>Xiamen 2026</h1>
            <span class="subtitle">4月24日 - 4月27日</span>
        </div>
        <div class="header-actions">
            <button class="refresh-fab" onclick="manualSync()">
                <i class="ph-bold ph-arrows-clockwise"></i>
            </button>
            <div class="weather-pill" id="weather-badge" onclick="fetchXiamenWeather()">
                🇨🇳 載入中
            </div>
        </div>
    </header>

    <main>
        <section id="view-accounting" class="view-container active">
            
            <div class="balance-card">
                <div class="b-title">
                    <span>Total Expenses</span>
                    <div class="b-title-right">
                        <span class="rate-badge" id="rate-display">匯率 4.45</span>
                        <button class="stats-btn" onclick="openStatsModal()">
                            <i class="ph-bold ph-chart-pie-slice"></i>
                        </button>
                    </div>
                </div>
                <h2 class="b-amount" id="total-primary">NT$ 0</h2>
                <div class="b-sub" id="total-secondary">≈ ¥ 0</div>

                <div class="budget-wrapper">
                    <div class="budget-info">
                        <span id="budget-rem-label">剩餘 NT$ 30,000</span>
                        <span class="budget-tot">/ 30k 預算</span>
                    </div>
                    <div class="budget-track">
                        <div class="budget-fill" id="budget-fill"></div>
                    </div>
                </div>
            </div>

            <div class="segment-wrapper" id="date-segment">
                <button class="seg-btn active" onclick="selectDate('4/24', this)">4/24</button>
                <button class="seg-btn" onclick="selectDate('4/25', this)">4/25</button>
                <button class="seg-btn" onclick="selectDate('4/26', this)">4/26</button>
                <button class="seg-btn" onclick="selectDate('4/27', this)">4/27</button>
            </div>

            <div class="segment-wrapper" id="person-segment">
                <button class="seg-btn active" onclick="selectPerson('', this)">👥 共用</button>
                <button class="seg-btn" onclick="selectPerson('小爸', this)">🦭 小爸</button>
                <button class="seg-btn" onclick="selectPerson('阿馨', this)">🐹 阿馨</button>
                <button class="seg-btn" onclick="selectPerson('阿雪', this)">🐵 阿雪</button>
            </div>

            <h3 class="section-title">選擇分類</h3>
            <div class="bento-grid" id="category-container">
                <button class="bento-box active" onclick="selectCategory('交通', this)">
                    <i class="ph-fill ph-taxi bento-icon"></i>
                    <span class="bento-label">交通</span>
                </button>
                <button class="bento-box" onclick="selectCategory('食物', this)">
                    <i class="ph-fill ph-hamburger bento-icon"></i>
                    <span class="bento-label">食物</span>
                </button>
                <button class="bento-box" onclick="selectCategory('購物', this)">
                    <i class="ph-fill ph-tote bento-icon"></i>
                    <span class="bento-label">購物</span>
                </button>
                <button class="bento-box" onclick="selectCategory('其他', this)">
                    <i class="ph-fill ph-sparkle bento-icon"></i>
                    <span class="bento-label">其他</span>
                </button>
            </div>

            <h3 class="section-title">記下一筆</h3>
            <div class="input-composite">
                <div class="input-row">
                    <input type="text" id="item-name" placeholder="品項名稱 (選填)">
                </div>

                <div class="price-action-row">
                    <div class="price-input-wrapper">
                        <div class="curr-toggle" id="curr-toggle" onclick="toggleCurrency()">¥</div>
                        <input type="number" id="item-price" placeholder="輸入人民幣" min="0" step="0.01">
                    </div>
                    <button class="submit-fab" onclick="addExpense()"><i class="ph-bold ph-plus"></i></button>
                </div>
            </div>

            <h3 class="section-title">今日紀錄</h3>
            <div id="expense-list" class="history-list"></div>
        </section>

        <section id="view-itinerary" class="view-container">
            <div class="segment-wrapper" style="margin-top: 10px;">
                <button class="seg-btn active" onclick="switchDay('day1', this)">D1</button>
                <button class="seg-btn" onclick="switchDay('day2', this)">D2</button>
                <button class="seg-btn" onclick="switchDay('day3', this)">D3</button>
                <button class="seg-btn" onclick="switchDay('day4', this)">D4</button>
            </div>
            <div id="itinerary-content"></div>
        </section>

        <section id="view-flight" class="view-container" style="padding-top: 10px;"></section>
    </main>

    <nav class="bottom-nav">
        <button class="tab-btn active" id="tab-accounting" onclick="switchTab('accounting')">
            <i class="ph-fill ph-wallet"></i>
            <span>記帳</span>
        </button>
        <button class="tab-btn" id="tab-itinerary" onclick="switchTab('itinerary')">
            <i class="ph-fill ph-map-trifold"></i>
            <span>行程</span>
        </button>
        <button class="tab-btn" id="tab-flight" onclick="switchTab('flight')">
            <i class="ph-fill ph-airplane-tilt"></i>
            <span>航班</span>
        </button>
    </nav>

    <div class="modal-overlay" id="stats-modal" onclick="closeStatsModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="pull-indicator"></div>
            <div class="modal-header">
                <h3>分類花費統計</h3>
                <button onclick="closeStatsModal()" class="close-btn"><i class="ph-bold ph-x"></i></button>
            </div>
            <div id="stats-content"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVVY1EqQrjndhkeej_NIabBYYjNORHcRkaoev-wRGcWsRdO6HnvVrXg7BIIEHUYrVP/exec';

        function getSafeStorage(key, defaultVal) {
            try {
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : defaultVal;
            } catch (e) {
                console.error("Storage Error:", e);
                return defaultVal;
            }
        }

        const Store = {
            state: {
                rate: parseFloat(localStorage.getItem('cached_rate_xmn')) || 4.45, 
                expenses: getSafeStorage('cached_expenses_xmn', []),
                date: '4/24',
                person: '',     
                category: '交通',
                currency: 'RMB', 
                activeDay: 'day1'
            },
            updateRate(newRate) {
                this.state.rate = newRate;
                localStorage.setItem('cached_rate_xmn', newRate);
            },
            updateExpenses(newData) {
                this.state.expenses = newData;
                localStorage.setItem('cached_expenses_xmn', JSON.stringify(newData));
            }
        };

        const EMOJI_MAP = { '交通': 'ph-taxi', '食物': 'ph-hamburger', '購物': 'ph-tote', '其他': 'ph-sparkle' };
        const TOTAL_BUDGET = 30000;

        const ITINERARY_DATA = {
            day1: [
                { time: "預估 20 分鐘", title: "廈門瑞頤大酒店", address: "廈門市思明區鷺江道12號", icon: "ph-taxi", info: "包車 (¥50) 先寄放行李", mapUrl: "https://j.map.baidu.com/36/PoJ", imgUrl: "https://content.skyscnr.com/available/2306062384/2306062384_WxH.jpg" },
                { time: "預估 35 分鐘", title: "漁緯港海鮮自助", address: "SM商業城3期4層", icon: "ph-train", info: "地鐵1號線至烏石浦站 (¥3)", mapUrl: "https://j.map.baidu.com/24/LZQd", imgUrl: "https://g.udn.com.tw/upfiles/B_VI/visa520infinite/PSN_PHOTO/321/f_29304321_1.jpg" },
                { time: "預估 25 分鐘", title: "回飯店休息", address: "廈門市思明區鷺江道12號", icon: "ph-taxi", info: "計程車 (¥28)", mapUrl: "https://j.map.baidu.com/36/PoJ", imgUrl: "https://content.skyscnr.com/available/2306062384/2306062384_WxH.jpg" }
            ],
            day2: [
                { time: "預估 12 分鐘", title: "胡里山炮台", address: "廈門市思明區曾厝垵路2號", icon: "ph-taxi", info: "計程車 (¥20)", mapUrl: "https://j.map.baidu.com/c7/gos", imgUrl: "https://dimg04.c-ctrip.com/images/1lo6t12000c35o4p52F69_R_1000_500.png_.webp?proc=namelogo/d_5" },
                { time: "預估 10 分鐘", title: "曾厝垵主景區", address: "思明區環島南路", icon: "ph-bowl-food", info: "海鮮沙茶麵 (¥13 交通)", mapUrl: "https://j.map.baidu.com/c6/XUPi", imgUrl: "https://megapx-assets.dcard.tw/images/fe3aa22f-50ee-498d-9d24-2ff46e972a4d/640.jpeg" },
                { time: "預估 30 分鐘", title: "沙坡尾藝術西區", address: "思明區沙坡尾60號", icon: "ph-camera", info: "計程車 (¥17)", mapUrl: "https://j.map.baidu.com/9c/7vK", imgUrl: "https://www.highspeed.mtr.com.hk/tc/travel/images/theme/baa318339a5a43b48c2b3076ea8b45.jpg" },
                { time: "下午", title: "中山路步行街", address: "思明區中山路", icon: "ph-coffee", info: "黃則和花生湯", mapUrl: "https://j.map.baidu.com/1c/AsK", imgUrl: "https://lh6.googleusercontent.com/proxy/V1m0Rn2MnTCgJozk8xqaTV9XiUp8qbinJt-B-FTY41kXqhBp4ZUEa1BraqH2AQNnt2QL4-iv_4JsU4NxxqRsrpHDJJTXnXAt_6AsEW1hd5MOo6SiqTHeEocacUSJ" }
            ],
            day3: [
                { time: "預估 50 分鐘", title: "集美學村", address: "集美區銀江路183號", icon: "ph-train", info: "地鐵1號線至集美學村 (¥5)", mapUrl: "https://j.map.baidu.com/20/zXh", imgUrl: "https://res.klook.com/image/upload/w_750,h_469,c_fill,q_85/w_80,x_15,y_15,g_south_west,l_Klook_water_br_trans_yhcmh3/activities/hbtmmhrg6cjylyirtb6z.jpg" },
                { time: "預估 18 分鐘", title: "尚柏奧特萊斯", address: "集美區天水路2號", icon: "ph-tote", info: "計程車 (¥30)", mapUrl: "https://j.map.baidu.com/8f/u8h", imgUrl: "https://symphonyholdings.com/assets/img/meta.jpg" },
                { time: "晚上", title: "中山路步行街", address: "思明區中山路", icon: "ph-moon", info: "晚餐逛逛", mapUrl: "https://j.map.baidu.com/1c/AsK", imgUrl: "https://lh6.googleusercontent.com/proxy/V1m0Rn2MnTCgJozk8xqaTV9XiUp8qbinJt-B-FTY41kXqhBp4ZUEa1BraqH2AQNnt2QL4-iv_4JsU4NxxqRsrpHDJJTXnXAt_6AsEW1hd5MOo6SiqTHeEocacUSJ" }
            ],
            day4: [
                { time: "早上", title: "黑門市場吃海鮮", address: "中央區日本橋", icon: "ph-fish", info: "步行前往", mapUrl: "https://j.map.baidu.com/47/bYd", imgUrl: "https://file.variflight.com/buckets/carnoc/keys/7d08cc3dcf7d03f6bbde6f98a9177a0d.jpeg" },
                { time: "預估 25 分鐘", title: "出發機場", address: "廈門高崎國際機場", icon: "ph-airplane", info: "準備搭乘11:40班機", mapUrl: "https://j.map.baidu.com/47/bYd", imgUrl: "https://file.variflight.com/buckets/carnoc/keys/7d08cc3dcf7d03f6bbde6f98a9177a0d.jpeg" }
            ]
        };

        const FLIGHT_DATA = [
            { label: "去程 Outbound", date: "4/24 (五)", fCode: "TPE", tCode: "XMN", dTime: "08:40", aTime: "10:30", air: "MANDARIN AE991", url: "https://www.mandarin-airlines.com/b2c/webcheckin" },
            { label: "回程 Inbound", date: "4/27 (一)", fCode: "XMN", tCode: "TPE", dTime: "11:40", aTime: "13:30", air: "MANDARIN AE992", url: "https://www.mandarin-airlines.com/b2c/webcheckin" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderFlights();
            renderItinerary('day1');
            fetchExchangeRate();
            fetchXiamenWeather();
            
            try {
                renderExpenses();
                if (navigator.onLine) fetchExpenses();
            } catch (e) {
                console.error(e);
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(`view-${tabId}`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function switchDay(day, el) {
            document.querySelectorAll('#view-itinerary .seg-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            renderItinerary(day);
        }

        function selectDate(date, el) {
            Store.state.date = date;
            document.querySelectorAll('#date-segment .seg-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            renderExpenses();
        }

        function selectPerson(person, el) {
            Store.state.person = person;
            document.querySelectorAll('#person-segment .seg-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }

        function selectCategory(cat, el) {
            Store.state.category = cat;
            document.querySelectorAll('.bento-box').forEach(box => box.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleCurrency() {
            const toggleBtn = document.getElementById('curr-toggle');
            const inputField = document.getElementById('item-price');
            
            if (Store.state.currency === 'RMB') {
                Store.state.currency = 'TWD';
                toggleBtn.innerText = '$';
                toggleBtn.style.color = 'var(--secondary)';
                inputField.placeholder = "輸入台幣金額";
            } else {
                Store.state.currency = 'RMB';
                toggleBtn.innerText = '¥';
                toggleBtn.style.color = 'var(--primary)';
                inputField.placeholder = "輸入人民幣";
            }
        }

        function manualSync() {
            showToast('正在同步資料...', 'success');
            fetchExpenses();
            fetchExchangeRate();
        }

        function openStatsModal() {
            const container = document.getElementById('stats-content');
            let stats = { '交通': 0, '食物': 0, '購物': 0, '其他': 0 };
            let totalTWD = 0;
            
            Store.state.expenses.forEach(item => {
                let price = Math.round(parseFloat(item.price) || 0);
                stats[item.cat] = (stats[item.cat] || 0) + price;
                totalTWD += price;
            });

            let html = '';
            const cats = ['交通', '食物', '購物', '其他'];
            cats.forEach(cat => {
                let valTWD = stats[cat];
                let valRMB = (valTWD / Store.state.rate).toFixed(1);
                let icon = EMOJI_MAP[cat] || 'ph-sparkle';
                let percent = totalTWD === 0 ? 0 : Math.round((valTWD / totalTWD) * 100);
                
                html += `
                <div class="stat-item">
                    <div class="stat-left">
                        <div class="stat-icon"><i class="ph-fill ${icon}"></i></div>
                        <div class="stat-info">
                            <h4>${cat}</h4>
                            <span class="stat-percent">${percent}% 佔比</span>
                        </div>
                    </div>
                    <div class="stat-right">
                        <span class="s-twd">$${valTWD.toLocaleString()}</span>
                        <span class="s-jpy">≈ ¥${valRMB}</span>
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
            document.getElementById('stats-modal').classList.add('active');
        }

        function closeStatsModal() {
            document.getElementById('stats-modal').classList.remove('active');
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="ph-fill ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'}"></i> <span>${msg}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function renderItinerary(day) {
            const container = document.getElementById('itinerary-content');
            let html = '';
            (ITINERARY_DATA[day] || []).forEach(item => {
                html += `
                <div class="trip-card">
                    <img src="${item.imgUrl}" class="t-img" loading="lazy">
                    <div class="t-body">
                        <span class="t-time">${item.time}</span>
                        <h3 class="t-title">${item.title}</h3>
                        <div class="t-row"><i class="ph-bold ${item.icon}"></i> ${item.info}</div>
                        <div class="t-row"><i class="ph-bold ph-map-pin"></i> ${item.address}</div>
                        <a href="${item.mapUrl}" class="map-btn" target="_blank">Google/Baidu 導航</a>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderFlights() {
            const container = document.getElementById('view-flight');
            let html = '';
            FLIGHT_DATA.forEach(f => {
                html += `
                <div class="flight-card">
                    <div class="f-top">
                        <div><span class="f-code">${f.fCode}</span><span class="f-city">DEPARTURE</span></div>
                        <i class="ph-fill ph-airplane-tilt f-icon"></i>
                        <div style="text-align:right;"><span class="f-code">${f.tCode}</span><span class="f-city">ARRIVAL</span></div>
                    </div>
                    <div class="f-grid">
                        <div><span class="f-label">Date</span><span class="f-val">${f.date}</span></div>
                        <div><span class="f-label">Flight</span><span class="f-val">${f.air}</span></div>
                        <div><span class="f-label">Time</span><span class="f-val">${f.dTime}</span></div>
                        <div><span class="f-label">Arrive</span><span class="f-val">${f.aTime}</span></div>
                    </div>
                    <a href="${f.url}" class="map-btn" target="_blank" style="background:#713e18; color:#FCFAFA; border:none;">線上報到</a>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderExpenses() {
            let totalTWD = 0;
            const listEl = document.getElementById('expense-list');
            listEl.innerHTML = '';
            
            const todayItems = Store.state.expenses.filter(item => {
                const sheetDate = String(item.date).trim();
                const targetDate = Store.state.date; 
                
                if (sheetDate === targetDate || sheetDate.includes(targetDate)) return true;
                if (sheetDate.includes('T') || sheetDate.includes('-')) {
                    const d = new Date(sheetDate);
                    const md = `${d.getMonth() + 1}/${d.getDate()}`;
                    return md === targetDate;
                }
                return false;
            });

            if (todayItems.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; padding: 40px 20px; color: var(--text-muted); font-weight:600;">本日尚無紀錄</div>`;
            } else {
                todayItems.forEach(item => {
                    const price = Math.round(parseFloat(item.price));
                    const safeName = String(item.name).replace(/[<>]/g, "");
                    const icon = EMOJI_MAP[item.cat] || 'ph-sparkle';
                    
                    let personTagHtml = '';
                    let displayName = safeName;
                    const tagMatch = safeName.match(/^【(.*?)】(.*)/);
                    if (tagMatch) {
                        personTagHtml = `<span class="h-tag">${tagMatch[1]}</span>`;
                        displayName = tagMatch[2].trim();
                    }

                    listEl.innerHTML += `
                    <div class="h-item">
                        <div class="h-left">
                            <div class="h-icon"><i class="ph-fill ${icon}"></i></div>
                            <div class="h-info">
                                <h4>${displayName} ${personTagHtml}</h4>
                                <span class="h-jpy">${item.cat}</span>
                            </div>
                        </div>
                        <div class="h-right">
                            <div class="h-price">$${price}</div>
                            <button class="h-del" onclick="deleteExpense('${item.id}')"><i class="ph-bold ph-trash"></i></button>
                        </div>
                    </div>`;
                });
            }

            Store.state.expenses.forEach(item => { totalTWD += Math.round(parseFloat(item.price) || 0); });
            const totalRMB = (totalTWD / Store.state.rate).toFixed(1);
            
            document.getElementById('total-primary').innerText = `NT$ ${totalTWD.toLocaleString()}`;
            document.getElementById('total-secondary').innerText = `≈ ¥ ${totalRMB}`;

            let spentPercent = (totalTWD / TOTAL_BUDGET) * 100;
            let remaining = TOTAL_BUDGET - totalTWD;
            const fillEl = document.getElementById('budget-fill');
            const remLabel = document.getElementById('budget-rem-label');

            if (remaining >= 0) {
                remLabel.innerText = `剩餘 NT$ ${remaining.toLocaleString()}`;
                fillEl.style.width = `${Math.min(spentPercent, 100)}%`;
                fillEl.style.background = spentPercent > 85 ? 'var(--accent)' : 'var(--color-success)'; 
            } else {
                remLabel.innerText = `超支 NT$ ${Math.abs(remaining).toLocaleString()}`;
                fillEl.style.width = `100%`;
                fillEl.style.background = 'var(--color-danger)';
            }
        }

        async function fetchExchangeRate() {
            try {
                // 改為抓取人民幣 CNY
                const res = await fetch('https://open.er-api.com/v6/latest/CNY');
                const data = await res.json();
                if (data?.rates?.TWD) Store.updateRate(data.rates.TWD);
            } catch (e) { console.warn('匯率更新失敗'); }
            document.getElementById('rate-display').innerText = `匯率 ${Store.state.rate.toFixed(2)}`;
            renderExpenses();
        }

        async function fetchXiamenWeather() {
            const badge = document.getElementById('weather-badge');
            try {
                // 廈門經緯度
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=24.4798&longitude=118.0894&current_weather=true&timezone=Asia%2FShanghai`);
                const data = await res.json();
                badge.innerHTML = `🇨🇳 廈門 ${Math.round(data.current_weather.temperature)}°C`;
            } catch (e) { badge.innerHTML = `🇨🇳 天氣異常`; }
        }

        async function fetchExpenses() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=read&t=${Date.now()}`);
                const freshData = await res.json();
                if (Array.isArray(freshData)) {
                    Store.updateExpenses(freshData);
                    renderExpenses();
                }
            } catch (err) { console.error("Fetch Data Error:", err); }
        }

        async function addExpense() {
            const nameEl = document.getElementById('item-name');
            const priceEl = document.getElementById('item-price');
            const inputPrice = parseFloat(priceEl.value); 
            
            if (isNaN(inputPrice) || inputPrice <= 0) return showToast('請輸入有效金額', 'error'); 
            
            let baseName = nameEl.value.trim() || Store.state.category;
            let finalName = Store.state.person ? `【${Store.state.person}】${baseName}` : baseName;
            
            // 判斷 RMB 或 TWD 換算
            const finalPriceTWD = Store.state.currency === 'RMB' ? Math.round(inputPrice * Store.state.rate) : Math.round(inputPrice); 
            
            const newId = Date.now().toString();
            const newExpenseObj = { id: newId, date: Store.state.date, cat: Store.state.category, name: finalName, price: finalPriceTWD };
            
            Store.updateExpenses([...Store.state.expenses, newExpenseObj]);
            renderExpenses();
            
            nameEl.value = ''; priceEl.value = ''; priceEl.blur(); 
            showToast(`已新增一筆花費`);

            try {
                const params = new URLSearchParams({ action: 'add', ...newExpenseObj });
                await fetch(SCRIPT_URL, { method: 'POST', body: params });
                fetchExpenses();
            } catch (err) { showToast('背景同步失敗，已存於本機', 'error'); }
        }

        async function deleteExpense(id) {
            if (!confirm('確定刪除此筆紀錄？')) return;
            const original = [...Store.state.expenses]; 
            Store.updateExpenses(Store.state.expenses.filter(item => String(item.id) !== String(id)));
            renderExpenses(); 

            try { 
                await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'delete', id: String(id) }) }); 
                showToast('紀錄已刪除');
                fetchExpenses();
            } catch (err) { 
                Store.updateExpenses(original); renderExpenses(); 
                showToast('刪除失敗', 'error');
            }
        }
    </script>
</body>
